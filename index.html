          // Deltagartabell under buffert-raderna (utan teknikgenomgång!)
          rowCursor += 1;
          ws1.getRow(rowCursor).height = 30;
          ws1.mergeCells(rowCursor, 1, rowCursor, 2);
          ws1.mergeCells(rowCursor, 3, rowCursor, 4);
          ws1.mergeCells(rowCursor, 7, rowCursor, 8);
          ws1.getCell(rowCursor, 1).value = 'På plats eller på distans';
          ws1.getCell(rowCursor, 3).value = 'Namn (i den ordning de medverkar i programmet!)';
          ws1.getCell(rowCursor, 5).value = 'Organisation';
          ws1.getCell(rowCursor, 6).value = 'Mail till distansmedverkande';
          ws1.getCell(rowCursor, 7).value = 'Mobilnummer till distansmedverkande';

          for (let c = 1; c <= 8; c++) {
            const cell = ws1.getCell(rowCursor, c);
            cell.fill = headerFill;
            cell.font = headerFont;
            cell.border = thinBorder;
            cell.alignment = { vertical: 'middle', horizontal: 'left', wrapText: true };
          }

          rowCursor += 1;
          const listToExport = analysis.orderedParticipants;
          const totalParticipantRows = Math.max(8, listToExport.length);

          for (let idx = 0; idx < totalParticipantRows; idx++) {
            const p = listToExport[idx] || null;
            const row = ws1.getRow(rowCursor);
            row.height = 24;
            ws1.mergeCells(rowCursor, 1, rowCursor, 2);
            ws1.mergeCells(rowCursor, 3, rowCursor, 4);
            ws1.mergeCells(rowCursor, 7, rowCursor, 8);

            if (p) {
              const modeLabel = p.mode === 'remote' ? 'På distans' : 'På plats';
              const micTag =
                p.mode === 'studio' && p.assignedMic ? ` (${p.assignedMic})` : '';
              ws1.getCell(rowCursor, 1).value = `${modeLabel}${micTag}`;
              ws1.getCell(rowCursor, 3).value = `${idx + 1}. ${p.name}`;
              ws1.getCell(rowCursor, 5).value = [p.organization, p.role].filter(Boolean).join(' – ');
              ws1.getCell(rowCursor, 6).value = p.mode === 'remote' ? p.email || '' : '';
              ws1.getCell(rowCursor, 7).value = p.mode === 'remote' ? p.mobile || '' : '';
            } else {
              ws1.getCell(rowCursor, 1).value = '';
              ws1.getCell(rowCursor, 3).value = `${idx + 1}. `;
              ws1.getCell(rowCursor, 5).value = '';
              ws1.getCell(rowCursor, 6).value = '';
              ws1.getCell(rowCursor, 7).value = '';
            }

            for (let c = 1; c <= 8; c++) {
              const cell = ws1.getCell(rowCursor, c);
              cell.fill = whiteFill;
              cell.font = c === 3 && p ? boldFont : bodyFont;
              cell.border = thinBorder;
              cell.alignment = { vertical: 'middle', horizontal: 'left', wrapText: true };
            }
            rowCursor += 1;
          }

          // -----------------------------------------------------------------
          // FLIK 2: TIPS FÖR DIG SOM PLANERAR
          // -----------------------------------------------------------------
          const ws2 = workbook.addWorksheet('Tips för dig som planerar');
          ws2.columns = [{ width: 32 }, { width: 82 }];

          ws2.getRow(1).height = 30;
          ws2.mergeCells('A1:B1');
          const ws2Title = ws2.getCell('A1');
          ws2Title.value = 'Tips för dig som planerar en live-webbsändning';
          ws2Title.fill = headerFill;
          ws2Title.font = { name: 'Calibri', size: 15, bold: true, color: { argb: 'FFFFFFFF' } };
          ws2Title.alignment = { vertical: 'middle', horizontal: 'left' };

          ws2.getRow(3).height = 25;
          ws2.getCell('A3').value = 'Nr / Område';
          ws2.getCell('B3').value = 'Planeringstips för live-webbsändning';
          ['A3', 'B3'].forEach(function (ref) {
            const cell = ws2.getCell(ref);
            cell.fill = headerFill;
            cell.font = headerFont;
            cell.border = thinBorder;
          });

          const planningTips = [
            ['1. Tydligt syfte och målgrupp', 'Definiera vad tittarna ska ta med sig efter sändningen och anpassa språk, nivå och exempel efter målgruppen.'],
            ['2. Håll tempot och variera formatet', 'Växla mellan korta presentationer, samtal och konkreta exempel. Undvik långa monologer utan paus eller byte.'],
            ['3. Tydlig roll för moderatorn', 'Moderatorn leder tittarna genom programmet, introducerar medverkande, håller tiden och fångar upp frågor.'],
            ['4. Planera in- och utgångar i studion', 'Lägg in tydliga rader för när personer går på och av så att ljud- och bildproducent kan förbereda byten smidigt.'],
            ['5. Presentationsmaterial i god tid', 'Samla PowerPoint-bilder och eventuella Menti-moment i en gemensam presentation i 16:9-format med stor, tydlig text.'],
            ['6. Teknikgenomgång för distansgäster', 'Säkerställ att medverkande på distans har testat ljud, kamera, ljus och uppkoppling inför sändningen.'],
            ['7. Lägg in luft i körschemat', 'Planera med marginaler så att sändningen hinner rundas av i tid utan stress i slutet.'],
          ];

          planningTips.forEach(function (pair, idx) {
            const r = 4 + idx;
            ws2.getRow(r).height = 36;
            const cA = ws2.getCell(r, 1);
            const cB = ws2.getCell(r, 2);
            cA.value = pair[0];
            cB.value = pair[1];
            cA.fill = progFill;
            cB.fill = whiteFill;
            cA.font = boldFont;
            cB.font = bodyFont;
            cA.border = thinBorder;
            cB.border = thinBorder;
            cA.alignment = { vertical: 'middle', horizontal: 'left', wrapText: true };
            cB.alignment = { vertical: 'middle', horizontal: 'left', wrapText: true };
          });

          const layoutStartRow = 12;
          ws2.getRow(layoutStartRow).height = 28;
          ws2.mergeCells(`A${layoutStartRow}:B${layoutStartRow}`);
          const layoutHeader = ws2.getCell(`A${layoutStartRow}`);
          layoutHeader.value = 'Förslag till upplägg';
          layoutHeader.fill = headerFill;
          layoutHeader.font = { name: 'Calibri', size: 13, bold: true, color: { argb: 'FFFFFFFF' } };
          layoutHeader.alignment = { vertical: 'middle', horizontal: 'left' };

          const subHeaderRow = layoutStartRow + 1;
          ws2.getRow(subHeaderRow).height = 24;
          ws2.getCell(subHeaderRow, 1).value = 'Tidsåtgång';
          ws2.getCell(subHeaderRow, 2).value = 'Moment i sändningen';
          [1, 2].forEach(function (colIdx) {
            const cell = ws2.getCell(subHeaderRow, colIdx);
            cell.fill = headerFill;
            cell.font = headerFont;
            cell.border = thinBorder;
            cell.alignment = { vertical: 'middle', horizontal: 'left' };
          });

          const suggestedStructure = [
            ['3 min', 'Inledning: Välkomna, syfte och presentation av dagens program'],
            ['15 min', 'Aktuellt: Omvärldsbevakning, nyheter eller huvudpresentation'],
            ['10 min', 'Samtal / reflektion i studio kring huvudbudskapen'],
            ['> 20 min', 'Fördjupning: Goda exempel och erfarenheter från verksamheten'],
            ['3 min', 'Kort sammanfattning och byte av medverkande'],
            ['10 min', 'Frågestund: Svar på tittarnas frågor från chatt eller Menti'],
            ['3 min', 'Avslutning: Summering, kontaktvägar och tack för idag'],
            ['ca 60 min', 'Totalt'],
          ];

          suggestedStructure.forEach(function (pair, idx) {
            const r = subHeaderRow + 1 + idx;
            const isTotal = pair[1] === 'Totalt';
            ws2.getRow(r).height = 26;
            const cA = ws2.getCell(r, 1);
            const cB = ws2.getCell(r, 2);
            cA.value = pair[0];
            cB.value = pair[1];
            cA.fill = isTotal ? enterFill : whiteFill;
            cB.fill = isTotal ? enterFill : whiteFill;
            cA.font = boldFont;
            cB.font = isTotal ? boldFont : bodyFont;
            cA.border = thinBorder;
            cB.border = thinBorder;
            cA.alignment = { vertical: 'middle', horizontal: 'left', wrapText: true };
            cB.alignment = { vertical: 'middle', horizontal: 'left', wrapText: true };
          });

          // -----------------------------------------------------------------
          // FLIK 3: FÖR DINA MEDVERKANDE
          // -----------------------------------------------------------------
          const ws3 = workbook.addWorksheet('För dina medverkande');
          ws3.columns = [{ width: 32 }, { width: 82 }];

          ws3.getRow(1).height = 30;
          ws3.mergeCells('A1:B1');
          const ws3Title = ws3.getCell('A1');
          ws3Title.value = 'Tips för dina medverkande på länk';
          ws3Title.fill = headerFill;
          ws3Title.font = { name: 'Calibri', size: 15, bold: true, color: { argb: 'FFFFFFFF' } };
          ws3Title.alignment = { vertical: 'middle', horizontal: 'left' };

          ws3.getRow(3).height = 25;
          ws3.getCell('A3').value = 'Område';
          ws3.getCell('B3').value = 'Råd inför din medverkan';
          ['A3', 'B3'].forEach(function (ref) {
            const cell = ws3.getCell(ref);
            cell.fill = headerFill;
            cell.font = headerFont;
            cell.border = thinBorder;
          });

          const participantTips = [
            ['Bakgrund och ljus', 'Välj en lugn och städad bakgrund. Se till att du har ljuset framifrån (t.ex. från ett fönster eller en lampa framför dig) och undvik starkt motljus bakom ryggen.'],
            ['Avstånd', 'Sitt på lagom armlängds avstånd från datorn så att huvud och axlar syns tydligt i bild utan att du hamnar för nära eller för långt bort.'],
            ['Placering av kamera', 'Placera webbkameran i ögonhöjd, exempelvis genom att palla upp datorn på några böcker, och titta in i kameran när du talar.'],
            ['Ljud', 'Sitt i ett tyst rum utan eko eller bakgrundsljud. Använd gärna trådbundet headset eller extern mikrofon och stäng av aviseringar på dator och mobil.'],
            ['Kläder', 'Välj enfärgade kläder i lugna toner och undvik smårutiga, smårandiga eller starkt flimrande mönster som kan skapa oro i kamerabilden.'],
          ];

          participantTips.forEach(function (pair, idx) {
            const r = 4 + idx;
            ws3.getRow(r).height = 42;
            const cA = ws3.getCell(r, 1);
            const cB = ws3.getCell(r, 2);
            cA.value = pair[0];
            cB.value = pair[1];
            cA.fill = enterFill;
            cB.fill = whiteFill;
            cA.font = boldFont;
            cB.font = bodyFont;
            cA.border = thinBorder;
            cB.border = thinBorder;
            cA.alignment = { vertical: 'middle', horizontal: 'left', wrapText: true };
            cB.alignment = { vertical: 'middle', horizontal: 'left', wrapText: true };
          });

          const buffer = await workbook.xlsx.writeBuffer();
          const blob = new Blob([buffer], {
            type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',
          });
          const url = URL.createObjectURL(blob);

          const cleanTitle = (b.title || 'Korschema')
            .trim()
            .replace(/[\\/:*?"<>|]+/g, '')
            .replace(/\s+/g, '_');
          const fileName = `${cleanTitle}_${b.date || 'schema'}.xlsx`;

          const a = document.createElement('a');
          a.href = url;
          a.download = fileName;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);

          showToast(`Exporterade ${fileName} med 3 flikar.`);
        } catch (err) {
          console.error('Excel-export misslyckades:', err);
          exportFallbackCsv();
        } finally {
          uiState.exportingXlsx = false;
          renderBottomNav();
          if (uiState.activeStep === 4) {
            const topBtn = document.getElementById('btn-export-xlsx-top');
            if (topBtn) {
              topBtn.disabled = false;
              topBtn.textContent = 'Ladda ner Excel (.xlsx)';
            }
          }
        }
      }

      // -----------------------------------------------------------------------
      // 11. HUVUDRENDERING
      // -----------------------------------------------------------------------
      function renderAll() {
        renderStepper();
        if (uiState.activeStep === 1) renderStep1();
        else if (uiState.activeStep === 2) renderStep2();
        else if (uiState.activeStep === 3) renderStep3();
        else renderStep4();
        renderBottomNav();
      }

      // Starta direkt när DOM är redo (utan externa ramverk)
      renderAll();
    })();
  </script>
</body>
</html>
