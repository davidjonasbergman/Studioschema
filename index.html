<body class="bg-slate-50 text-slate-900 min-h-screen">
  <div id="root">

      <p class="text-sm text-slate-600 mb-4">

  <script>
    window.addEventListener('DOMContentLoaded', function () {
      setTimeout(function () {
        if (!window.React || !window.ReactDOM || !window.Babel) {
          var fb = document.getElementById('cdn-fallback');
          if (fb) {
            fb.innerHTML =
              '<h2 class="text-lg font-bold text-rose-700 mb-2">Kunde inte ladda externa bibliotek (CDN)</h2>' +
              '<p class="text-sm text-slate-600 mb-4">Kontrollera internetanslutningen eller om brandvägg blockerar <code>cdn.jsdelivr.net</code>. ExcelJS-status: <strong>' +
              (window.ExcelJS ? 'Tillgänglig' : 'Ej laddad') +
              '</strong>.</p>' +
              '<button type="button" onclick="window.location.reload()" class="px-4 py-2 rounded-xl bg-indigo-600 text-white text-sm font-semibold">Försök igen</button>';
          }
        }
      }, 3500);
    });
  </script>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useMemo, useRef } = React;

    // =========================================================================
    // KONSTANTER & STARTLÄGE (PRODUKTION UTAN EXEMPELDATA)
    // =========================================================================
    const STORAGE_KEY = 'korschema_studio_prod_v1';

    const STEPS = [
      { id: 1, label: '1. Sändningsbrief' },
      { id: 2, label: '2. Deltagarlista' },
      { id: 3, label: '3. Körschema' },
      { id: 4, label: '4. Granska & Exportera' },
    ];

    const RECORDING_OPTIONS = [
      'Ja, 14 dagar',
      'Ja, 30 dagar',
      'Ja, mer än 30 dagar',
      'Nej',
    ];

    const PRESENTATION_PRESETS = [
      'Master PPT',
      'PowerPoint',
      'Menti',
      'Video/klipp',
    ];

    // Beräknar dagens lokala datum (YYYY-MM-DD), närmsta halvtimme som starttid
    // (t.ex. 13:09 -> 13:00, 13:16 -> 13:30) samt sluttid 60 minuter senare.
    function getDefaultScheduleDefaults() {
      const now = new Date();
      const totalMinutes = now.getHours() * 60 + now.getMinutes();
      const roundedStartMinutes = Math.round(totalMinutes / 30) * 30;

      const startDateObj = new Date(
        now.getFullYear(),
        now.getMonth(),
        now.getDate(),
        0,
        roundedStartMinutes,
        0,
        0
      );
      const endDateObj = new Date(startDateObj.getTime() + 60 * 60 * 1000);

      const date = [
        startDateObj.getFullYear(),
        String(startDateObj.getMonth() + 1).padStart(2, '0'),
        String(startDateObj.getDate()).padStart(2, '0'),
      ].join('-');

      const startTime = `${String(startDateObj.getHours()).padStart(2, '0')}:${String(
        startDateObj.getMinutes()
      ).padStart(2, '0')}`;

      const endTime = `${String(endDateObj.getHours()).padStart(2, '0')}:${String(
        endDateObj.getMinutes()
      ).padStart(2, '0')}`;

      return { date, startTime, endTime };
    }

    function createEmptyData() {
      const defaults = getDefaultScheduleDefaults();
      return {
        brief: {
          templateTitle: 'Quickchannel körschema på 4F',
          title: '',
          date: defaults.date,
          startTime: defaults.startTime,
          endTime: defaults.endTime,
          handler: '',
          phone: '',
          email: '',
          chatEnabled: 'Ja',
          recordingAvailable: 'Ja, 30 dagar',
          description: '',
        },
        participants: [],
        events: [],
      };
    }

    // =========================================================================
    // DATUM- & TIDSBERÄKNINGAR
    // =========================================================================
    function parseHHMM(timeStr) {
      if (!timeStr || !/^\d{1,2}:\d{2}$/.test(timeStr.trim())) {
        const fallback = getDefaultScheduleDefaults().startTime;
        const [fh, fm] = fallback.split(':').map(Number);
        return fh * 60 + fm;
      }
      const [h, m] = timeStr.trim().split(':').map(Number);
      if (Number.isNaN(h) || Number.isNaN(m)) return 13 * 60;
      return h * 60 + m;
    }

    function formatMinutesHHMM(totalMinutes) {
      const safe = Math.max(0, Math.round(totalMinutes));
      const dayOffset = Math.floor(safe / 1440);
      const minsOfDay = safe % 1440;
      const h = Math.floor(minsOfDay / 60);
      const m = minsOfDay % 60;
      return {
        hhmm: `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`,
        dayOffset,
      };
    }

    function formatSwedishDateDisplay(dateStr, startTime, endTime) {
      const months = [
        'januari', 'februari', 'mars', 'april', 'maj', 'juni',
        'juli', 'augusti', 'september', 'oktober', 'november', 'december',
      ];
      let datePart = dateStr || '';
      if (/^\d{4}-\d{2}-\d{2}$/.test(dateStr || '')) {
        const [y, mo, d] = dateStr.split('-').map(Number);
        const dt = new Date(Date.UTC(y, mo - 1, d));
        if (!Number.isNaN(dt.getTime())) {
          datePart = `${dt.getUTCDate()} ${months[dt.getUTCMonth()]}`;
        }
      }
      const timePart =
        startTime && endTime
          ? `${startTime}–${endTime}`
          : startTime || endTime || '';
      return [datePart, timePart].filter(Boolean).join(' ');
    }

    function computePlannedBroadcastDuration(dateStr, startTime, endTime) {
      const startMin = parseHHMM(startTime);
      const endMin = parseHHMM(endTime);

      let diffMinutes = endMin - startMin;
      let nextDay = false;

      if (diffMinutes < 0) {
        diffMinutes += 1440;
        nextDay = true;
      }

      const hours = Math.floor(diffMinutes / 60);
      const mins = diffMinutes % 60;

      let humanText = `${diffMinutes} min`;
      if (hours > 0 && mins > 0) {
        humanText = `${hours} tim ${mins} min (${diffMinutes} min)`;
      }

      return {
        totalMinutes: diffMinutes,
        hours,
        minutes: mins,
        nextDay,
        humanText,
        endMinutesAbsolute: startMin + diffMinutes,
      };
    }

    function analyzeScheduleAndMics(brief, participants, events) {
      const participantById = new Map(participants.map((p) => [p.id, p]));
      const micByParticipantId = new Map();
      const appearanceOrder = [];
      let nextStudioMicNumber = 1;

      // 1. Tilldela MIK 1, MIK 2 osv. till deltagare "På plats" i den ordning de först dyker upp i körschemat
      events.forEach((ev) => {
        const ids = Array.isArray(ev.speakerIds) ? ev.speakerIds : [];
        ids.forEach((id) => {
          const person = participantById.get(id);
          if (!person) return;
          if (!appearanceOrder.includes(id)) {
            appearanceOrder.push(id);
          }
          if (person.mode === 'studio' && !micByParticipantId.has(id)) {
            micByParticipantId.set(id, `MIK ${nextStudioMicNumber}`);
            nextStudioMicNumber += 1;
          }
        });
      });

      // 2. Ge övriga deltagare "På plats" (som inte lagts in i schemat ännu) nästkommande MIK-nummer
      participants.forEach((p) => {
        if (p.mode === 'studio' && !micByParticipantId.has(p.id)) {
          micByParticipantId.set(p.id, `MIK ${nextStudioMicNumber}`);
          nextStudioMicNumber += 1;
        }
      });

      // 3. Sortera deltagarlistan i programordning (följt av eventuella övriga deltagare)
      const orderedParticipants = [];
      const seen = new Set();
      appearanceOrder.forEach((id) => {
        const p = participantById.get(id);
        if (p && !seen.has(id)) {
          seen.add(id);
          orderedParticipants.push({
            ...p,
            assignedMic: micByParticipantId.get(id) || '',
          });
        }
      });
      participants.forEach((p) => {
        if (!seen.has(p.id)) {
          seen.add(p.id);
          orderedParticipants.push({
            ...p,
            assignedMic: micByParticipantId.get(p.id) || '',
          });
        }
      });

      let cursorMinutes = parseHHMM(brief.startTime);

      const computedEvents = events.map((ev, index) => {
        const validIds = (ev.speakerIds || []).filter((id) => participantById.has(id));
        const speakers = validIds.map((id) => participantById.get(id));

        // Samla unika MIK-nummer för deltagare "På plats" i denna händelse
        const evMics = [];
        validIds.forEach((id) => {
          const mic = micByParticipantId.get(id);
          if (mic && !evMics.includes(mic)) {
            evMics.push(mic);
          }
        });
        const autoMicText = evMics.join(' + ');

        let startFormatted = '';
        let endFormatted = '';
        let startMin = null;
        let endMin = null;
        let durationMin = 0;

        if (ev.type === 'program') {
          durationMin = Math.max(0, Number(ev.durationMinutes) || 0);
          startMin = cursorMinutes;
          endMin = cursorMinutes + durationMin;
          startFormatted = formatMinutesHHMM(startMin).hhmm;
          endFormatted = formatMinutesHHMM(endMin).hhmm;
          cursorMinutes = endMin;
        }

        return {
          ...ev,
          index,
          speakers,
          startMin,
          endMin,
          startFormatted,
          endFormatted,
          durationMin,
          autoMicText,
        };
      });

      const programEvents = computedEvents.filter((e) => e.type === 'program');
      const totalProgramMinutes = programEvents.reduce((acc, e) => acc + e.durationMin, 0);
      const scheduledEndFormatted = formatMinutesHHMM(cursorMinutes).hhmm;

      return {
        computedEvents,
        micByParticipantId,
        orderedParticipants,
        programCount: programEvents.length,
        totalProgramMinutes,
        scheduledEndMinutes: cursorMinutes,
        scheduledEndFormatted,
      };
    }

    // =========================================================================
    // ERROR BOUNDARY
    // =========================================================================
    class AppErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, errorMessage: '' };
      }

      static getDerivedStateFromError(error) {
        return {
          hasError: true,
          errorMessage: error && error.message ? error.message : 'Ett oväntat fel uppstod.',
        };
      }

      componentDidCatch(error, info) {
        console.error('Körschema Studio fel:', error, info);
      }

      render() {
        if (this.state.hasError) {
          return (
            <div className="max-w-xl mx-auto my-12 bg-white border border-rose-200 rounded-2xl p-6 shadow-sm">
              <h2 className="text-lg font-bold text-rose-700 mb-2">Något gick fel i gränssnittet</h2>
              <p className="text-sm text-slate-600 mb-4">{this.state.errorMessage}</p>
              <button
                type="button"
                className="px-4 py-2 rounded-xl bg-indigo-600 text-white text-sm font-semibold hover:bg-indigo-700"
                onClick={() => this.setState({ hasError: false, errorMessage: '' })}
              >
                Försök återställa vyn
              </button>
            </div>
          );
        }
        return this.props.children;
      }
    }

    // =========================================================================
    // HUVUDKOMPONENT: KÖRSCHEMA STUDIO
    // =========================================================================
    function KorschemaStudioApp() {
      const [activeStep, setActiveStep] = useState(1);

      const [state, setState] = useState(() => {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved) {
            const parsed = JSON.parse(saved);
            if (
              parsed &&
              parsed.brief &&
              Array.isArray(parsed.participants) &&
              Array.isArray(parsed.events)
            ) {
              return parsed;
            }
          }
        } catch (e) {
          // Ignorera lagringsfel
        }
        return createEmptyData();
      });

      const [advancedOpen, setAdvancedOpen] = useState(false);

      // Steg 2: formulär för ny / redigerad deltagare
      const [editingParticipantId, setEditingParticipantId] = useState(null);
      const [partName, setPartName] = useState('');
      const [partOrg, setPartOrg] = useState('');
      const [partRole, setPartRole] = useState('');
      const [partMode, setPartMode] = useState('studio');
      const [partEmail, setPartEmail] = useState('');
      const [partMobile, setPartMobile] = useState('');
      const [partTechCheck, setPartTechCheck] = useState('');
      const [partError, setPartError] = useState('');

      // Steg 3: expanderat kort för inline-redigering
      const [expandedEventId, setExpandedEventId] = useState(null);

      // Drag-and-drop i Steg 3
      const [draggedIndex, setDraggedIndex] = useState(null);
      const [dragOverIndex, setDragOverIndex] = useState(null);

      // Ångra-historik och toast
      const [undoSnapshot, setUndoSnapshot] = useState(null);
      const [toastMsg, setToastMsg] = useState('');
      const [exportingXlsx, setExportingXlsx] = useState(false);

      const undoTimerRef = useRef(null);

      useEffect(() => {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        } catch (e) {
          // Ignorera lagringsfel
        }
      }, [state]);

      function triggerToast(message, snapshotForUndo = null) {
        if (undoTimerRef.current) {
          clearTimeout(undoTimerRef.current);
        }
        setToastMsg(message);
        setUndoSnapshot(snapshotForUndo);
        undoTimerRef.current = setTimeout(() => {
          setToastMsg('');
          setUndoSnapshot(null);
        }, 7000);
      }

      function handleUndo() {
        if (!undoSnapshot) return;
        setState(undoSnapshot);
        setUndoSnapshot(null);
        setToastMsg('');
        if (undoTimerRef.current) clearTimeout(undoTimerRef.current);
      }

      function handleClearAll() {
        const prev = JSON.parse(JSON.stringify(state));
        setState(createEmptyData());
        setEditingParticipantId(null);
        setExpandedEventId(null);
        resetParticipantForm();
        setActiveStep(1);
        triggerToast('All data har rensats till ett nytt utkast.', prev);
      }

      // Beräkningar
      const plannedDuration = useMemo(
        () =>
          computePlannedBroadcastDuration(
            state.brief.date,
            state.brief.startTime,
            state.brief.endTime
          ),
        [state.brief.date, state.brief.startTime, state.brief.endTime]
      );

      const swedishDateTimeText = useMemo(
        () =>
          formatSwedishDateDisplay(
            state.brief.date,
            state.brief.startTime,
            state.brief.endTime
          ),
        [state.brief.date, state.brief.startTime, state.brief.endTime]
      );

      const scheduleAnalysis = useMemo(
        () => analyzeScheduleAndMics(state.brief, state.participants, state.events),
        [state.brief, state.participants, state.events]
      );

      // =====================================================================
      // STEG 1: SÄNDNINGSBRIEF HANDLERS
      // =====================================================================
      function updateBriefField(field, value) {
        setState((prev) => ({
          ...prev,
          brief: {
            ...prev.brief,
            [field]: value,
          },
        }));
      }

      // =====================================================================
      // STEG 2: DELTAGARLISTA HANDLERS
      // =====================================================================
      function resetParticipantForm() {
        setEditingParticipantId(null);
        setPartName('');
        setPartOrg('');
        setPartRole('');
        setPartMode('studio');
        setPartEmail('');
        setPartMobile('');
        setPartTechCheck('');
        setPartError('');
      }

      function handleSaveParticipant(e) {
        e.preventDefault();
        const trimmedName = partName.trim();
        if (!trimmedName) {
          setPartError('Ange deltagarens namn.');
          return;
        }
        const trimmedEmail = partEmail.trim();
        const trimmedMobile = partMobile.trim();
        const trimmedTechCheck = partTechCheck.trim();

        if (partMode === 'remote' && !trimmedEmail && !trimmedMobile) {
          setPartError('Ange e-postadress eller mobilnummer för deltagare på distans.');
          return;
        }

        setPartError('');

        if (editingParticipantId) {
          setState((prev) => ({
            ...prev,
            participants: prev.participants.map((p) =>
              p.id === editingParticipantId
                ? {
                    ...p,
                    name: trimmedName,
                    organization: partOrg.trim(),
                    role: partRole.trim(),
                    mode: partMode,
                    email: partMode === 'remote' ? trimmedEmail : '',
                    mobile: partMode === 'remote' ? trimmedMobile : '',
                    techCheck: partMode === 'remote' ? trimmedTechCheck : '',
                  }
                : p
            ),
          }));
          resetParticipantForm();
          triggerToast(`Uppdaterade ${trimmedName}.`);
        } else {
          const newPerson = {
            id: `p-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
            name: trimmedName,
            organization: partOrg.trim(),
            role: partRole.trim(),
            mode: partMode,
            email: partMode === 'remote' ? trimmedEmail : '',
            mobile: partMode === 'remote' ? trimmedMobile : '',
            techCheck: partMode === 'remote' ? trimmedTechCheck : '',
          };
          setState((prev) => ({
            ...prev,
            participants: [...prev.participants, newPerson],
          }));
          resetParticipantForm();
          triggerToast(`La till ${trimmedName} i deltagarlistan.`);
        }
      }

      function handleStartEditParticipant(person) {
        setEditingParticipantId(person.id);
        setPartName(person.name);
        setPartOrg(person.organization || '');
        setPartRole(person.role || '');
        setPartMode(person.mode === 'remote' ? 'remote' : 'studio');
        setPartEmail(person.email || '');
        setPartMobile(person.mobile || '');
        setPartTechCheck(person.techCheck || '');
        setPartError('');
      }

      function handleDeleteParticipant(personId) {
        const target = state.participants.find((p) => p.id === personId);
        setState((prev) => ({
          ...prev,
          participants: prev.participants.filter((p) => p.id !== personId),
          events: prev.events.map((ev) => ({
            ...ev,
            speakerIds: (ev.speakerIds || []).filter((id) => id !== personId),
          })),
        }));
        if (editingParticipantId === personId) {
          resetParticipantForm();
        }
        if (target) {
          triggerToast(`Tog bort ${target.name} från deltagarlistan.`);
        }
      }

      // =====================================================================
      // STEG 3: KÖRSCHEMA HANDLERS
      // =====================================================================
      function handleQuickAddEvent(kind) {
        const defaultSpeakers =
          state.participants.length > 0 ? [state.participants[0].id] : [];
        const firstName =
          state.participants.length > 0
            ? state.participants[0].name.split(' ')[0]
            : 'Deltagare';

        let created;
        if (kind === 'program') {
          created = {
            id: `ev-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
            type: 'program',
            title: 'Ny programpunkt',
            durationMinutes: 5,
            speakerIds: defaultSpeakers,
            material: 'Master PPT',
            extraNote: '',
          };
        } else if (kind === 'enter') {
          created = {
            id: `ev-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
            type: 'enter_exit',
            action: 'enter',
            title: `${firstName} på`,
            durationMinutes: 0,
            speakerIds: defaultSpeakers,
            material: '',
            extraNote: '',
          };
        } else {
          created = {
            id: `ev-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
            type: 'enter_exit',
            action: 'exit',
            title: `${firstName} av`,
            durationMinutes: 0,
            speakerIds: defaultSpeakers,
            material: '',
            extraNote: '',
          };
        }

        setState((prev) => ({
          ...prev,
          events: [...prev.events, created],
        }));
        setExpandedEventId(created.id);
      }

      function handleUpdateEvent(eventId, patch) {
        setState((prev) => ({
          ...prev,
          events: prev.events.map((ev) => (ev.id === eventId ? { ...ev, ...patch } : ev)),
        }));
      }

      function handleToggleEventSpeaker(eventId, speakerId) {
        setState((prev) => ({
          ...prev,
          events: prev.events.map((ev) => {
            if (ev.id !== eventId) return ev;
            const current = ev.speakerIds || [];
            const nextSpeakers = current.includes(speakerId)
              ? current.filter((id) => id !== speakerId)
              : [...current, speakerId];

            let nextTitle = ev.title;
            if (ev.type === 'enter_exit') {
              const names = nextSpeakers
                .map((id) => state.participants.find((p) => p.id === id))
                .filter(Boolean)
                .map((p) => p.name.split(' ')[0]);
              const label = names.length > 0 ? names.join(' + ') : 'Deltagare';
              nextTitle = ev.action === 'enter' ? `${label} på` : `${label} av`;
            }

            return { ...ev, speakerIds: nextSpeakers, title: nextTitle };
          }),
        }));
      }

      function handleDeleteEvent(eventId) {
        setState((prev) => ({
          ...prev,
          events: prev.events.filter((ev) => ev.id !== eventId),
        }));
        if (expandedEventId === eventId) {
          setExpandedEventId(null);
        }
      }

      function moveEventByOffset(index, offset) {
        const targetIndex = index + offset;
        if (targetIndex < 0 || targetIndex >= state.events.length) return;
        setState((prev) => {
          const copy = [...prev.events];
          const [moved] = copy.splice(index, 1);
          copy.splice(targetIndex, 0, moved);
          return { ...prev, events: copy };
        });
      }

      function handleDropOnEvent(targetIndex) {
        if (draggedIndex === null || draggedIndex === targetIndex) {
          setDraggedIndex(null);
          setDragOverIndex(null);
          return;
        }
        setState((prev) => {
          const copy = [...prev.events];
          const [moved] = copy.splice(draggedIndex, 1);
          copy.splice(targetIndex, 0, moved);
          return { ...prev, events: copy };
        });
        setDraggedIndex(null);
        setDragOverIndex(null);
      }

      // CSV-RESERVEXPORT (OM EXCELJS INTE ÄR TILLGÄNGLIG)
      // =========================================================================
      function exportFallbackCsv() {
        const rows = [
          [state.brief.templateTitle || 'Quickchannel körschema på 4F'],
          ['Namn på sändning (som publicerad)', state.brief.title || ''],
          ['Datum och sändningstid', `${swedishDateTimeText} (${plannedDuration.humanText})`],
          ['Ansvarig handläggare', state.brief.handler || ''],
          ['Telefonnummer', state.brief.phone || ''],
          ['Mailadress', state.brief.email || ''],
          ['Chattfunktion (Ja/Nej)', state.brief.chatEnabled],
          ['Ska inspelning vara tillgänglig? Hur länge?', state.brief.recordingAvailable],
          [],
          [
            'Start',
            'Slut',
            'Min',
            'Programpunkt',
            'Vem/vilka talar under programpunkten',
            'Presentationsmaterial för programpunkt (t.ex PPT eller Menti mm.)',
            'Extra notering',
            'Tekniska kommentarer och tid för anslutning',
          ],
        ];

        scheduleAnalysis.computedEvents.forEach((ev) => {
          rows.push([
            ev.type === 'program' ? ev.startFormatted : '',
            ev.type === 'program' ? ev.endFormatted : '',
            ev.type === 'program' ? String(ev.durationMin) : '',
            ev.title || '',
            ev.speakers.map((s) => s.name).join(', '),
            ev.type === 'program' ? ev.material || '' : '',
            ev.autoMicText || '',
            ev.extraNote || '',
          ]);
        });

        const csvContent =
          '\uFEFF' +
          rows
            .map((r) =>
              r.map((cell) => `"${String(cell ?? '').replace(/"/g, '""')}"`).join(';')
            )
            .join('\r\n');

        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const cleanTitle = (state.brief.title || 'Korschema')
          .trim()
          .replace(/[\\/:*?"<>|]+/g, '')
          .replace(/\s+/g, '_');
        const a = document.createElement('a');
        a.href = url;
        a.download = `${cleanTitle}_${state.brief.date || 'schema'}.csv`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        triggerToast('Exporterade CSV-reservfil för Excel.');
      }

            ['Placering av kamera', 'Placera webbkameran i ögonhöjd, exempelvis genom att palla upp datorn på några böcker, och titta in i kameran när du talar.'],
            ['Ljud', 'Sitt i ett tyst rum utan eko eller bakgrundsljud. Använd gärna trådbundet headset eller extern mikrofon och stäng av aviseringar på dator och mobil.'],
            ['Kläder', 'Välj enfärgade kläder i lugna toner och undvik smårutiga, smårandiga eller starkt flimrande mönster som kan skapa oro i kamerabilden.'],
          ];

          participantTips.forEach(([topic, text], idx) => {
            const r = 4 + idx;
            ws3.getRow(r).height = 42;
            const cA = ws3.getCell(r, 1);
            const cB = ws3.getCell(r, 2);
            cA.value = topic;
            cB.value = text;
            cA.fill = enterFill;
            cB.fill = whiteFill;
            cA.font = boldFont;
            cB.font = bodyFont;
            cA.border = thinBorder;
            cB.border = thinBorder;
            cA.alignment = { vertical: 'middle', horizontal: 'left', wrapText: true };
            cB.alignment = { vertical: 'middle', horizontal: 'left', wrapText: true };
          });

          const buffer = await workbook.xlsx.writeBuffer();
          const blob = new Blob([buffer], {
            type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',
          });
          const url = URL.createObjectURL(blob);

          const cleanTitle = (state.brief.title || 'Korschema')
            .trim()
            .replace(/[\\/:*?"<>|]+/g, '')
            .replace(/\s+/g, '_');
          const fileName = `${cleanTitle}_${state.brief.date || 'schema'}.xlsx`;

          const a = document.createElement('a');
          a.href = url;
          a.download = fileName;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);

          triggerToast(`Exporterade ${fileName} med 3 flikar.`);
        } catch (err) {
          console.error('Excel-export misslyckades:', err);
          exportFallbackCsv();
        } finally {
          setExportingXlsx(false);
        }
      }

        const diffFromPlanned =
          scheduleAnalysis.scheduledEndMinutes - plannedDuration.endMinutesAbsolute;

        let comparisonText = `Matchar planerad sluttid (${displayEnd})`;
        let comparisonClass = 'text-emerald-700';
        if (diffFromPlanned < 0) {
          comparisonText = `${Math.abs(diffFromPlanned)} min kvar till planerad sluttid (${displayEnd})`;
          comparisonClass = 'text-indigo-600';
        } else if (diffFromPlanned > 0) {

                  <div className={`text-xs font-semibold mt-0.5 ${comparisonClass}`}>
                    {comparisonText}
                  </div>
                </div>

                <div className="p-3.5 rounded-xl bg-slate-50 border border-slate-200">
                  <div className="text-xs font-semibold text-slate-500">Schemalagd programtid</div>
                  <div className="text-lg font-bold text-slate-900 mt-0.5">
                    {scheduleAnalysis.totalProgramMinutes} min
                  </div>
                  <div className="text-xs text-slate-600 mt-0.5">
                    Antal händelser: {scheduleAnalysis.computedEvents.length} st
                  </div>
                </div>
              </div>

              {/* Snabbknappar för att lägga till händelser */}
              <div className="flex flex-wrap items-center gap-2.5 p-3.5 mb-5 rounded-xl bg-slate-50 border border-slate-200">
                <span className="text-sm font-semibold text-slate-700 mr-1">
                  Lägg till händelse:
                </span>
                <button
                  type="button"
                  onClick={() => handleQuickAddEvent('program')}

                <button
                  type="button"
                  onClick={() => handleQuickAddEvent('enter')}

                >
                  + Person går på
                </button>
                <button
                  type="button"
                  onClick={() => handleQuickAddEvent('exit')}
                  className="px-3.5 py-2 rounded-xl bg-rose-600 text-white text-xs sm:text-sm font-semibold hover:bg-rose-700 transition-colors"
                >
                  + Person går av
                </button>
              </div>

              {/* Tidslinjekort */}
              {scheduleAnalysis.computedEvents.length === 0 ? (
                <div className="p-8 rounded-xl border border-dashed border-slate-300 bg-slate-50 text-sm text-slate-600">

                </div>
              ) : (
                <div className="space-y-3">
                  {scheduleAnalysis.computedEvents.map((ev, idx) => {
                    const isProgram = ev.type === 'program';
                    const isEnter = !isProgram && ev.action === 'enter';
                    const isExpanded = expandedEventId === ev.id;

                    const cardStyle = isProgram
                      ? 'bg-amber-50/75 border-amber-200 border-l-4 border-l-amber-500'
                      : isEnter
                        ? 'bg-emerald-50/75 border-emerald-200 border-l-4 border-l-emerald-500'
                        : 'bg-rose-50/75 border-rose-200 border-l-4 border-l-rose-500';

                    const badgeStyle = isProgram
                      ? 'bg-amber-100 text-amber-800'
                      : isEnter
                        ? 'bg-emerald-100 text-emerald-800'
                        : 'bg-rose-100 text-rose-800';

                    const badgeLabel = isProgram
                      ? 'Programpunkt'
                      : isEnter
                        ? 'Person går på'
                        : 'Person går av';

                    return (
                      <div
                        key={ev.id}
                        draggable
                        onDragStart={() => setDraggedIndex(idx)}
                        onDragOver={(e) => {
                          e.preventDefault();
                          if (dragOverIndex !== idx) setDragOverIndex(idx);
                        }}
                        onDragLeave={() => {
                          if (dragOverIndex === idx) setDragOverIndex(null);
                        }}
                        onDrop={() => handleDropOnEvent(idx)}
                        onDragEnd={() => {
                          setDraggedIndex(null);
                          setDragOverIndex(null);
                        }}
                        className={`rounded-xl border p-4 transition-all ${cardStyle} ${
                          draggedIndex === idx ? 'opacity-50' : ''
                        } ${
                          dragOverIndex === idx && draggedIndex !== idx
                            ? 'ring-2 ring-indigo-500'
                            : ''
                        }`}
                      >
                        <div className="flex flex-wrap items-center justify-between gap-2">

                              className="cursor-grab active:cursor-grabbing px-2 py-1 rounded-lg border border-slate-300 bg-white text-slate-600 text-xs font-bold select-none"
                              title="Dra för att flytta händelsen"
                              aria-label="Dra för att flytta händelsen"
                            >
                              ⋮⋮
                            </span>
                            <span
                              className={`inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold ${badgeStyle}`}
                            >
                              {badgeLabel}
                            </span>
                            {isProgram && (
                              <span className="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-white border border-amber-200 text-slate-800 tabular-nums">
                                {ev.startFormatted} – {ev.endFormatted} ({ev.durationMin} min)
                              </span>
                            )}
                            <span className="font-bold text-slate-900 text-sm sm:text-base">
                              {ev.title || 'Namnlös händelse'}
                            </span>
                          </div>

                          <div className="flex flex-wrap items-center gap-1.5">
                            <button
                              type="button"
                              onClick={() =>
                                setExpandedEventId((prev) => (prev === ev.id ? null : ev.id))

                              className="px-3 py-1.5 rounded-lg border border-slate-300 bg-white text-slate-700 text-xs font-semibold hover:bg-slate-50 transition-colors"

                            <button
                              type="button"
                              disabled={idx === scheduleAnalysis.computedEvents.length - 1}
                              onClick={() => moveEventByOffset(idx, 1)}

                              aria-label="Flytta ner"
                              className="px-2.5 py-1.5 rounded-lg border border-slate-300 bg-white text-slate-700 text-xs font-semibold hover:bg-slate-50 disabled:opacity-40"

                            </button>
                            <button
                              type="button"
                              onClick={() => handleDeleteEvent(ev.id)}

                            >
                              Ta bort
                            </button>
                          </div>
                        </div>

                        {/* Sammanfattningsrad när kortet är stängt */}
                        {!isExpanded && (
                          <div className="mt-2.5 flex flex-wrap items-center gap-2 text-xs sm:text-sm text-slate-700">
                            <span>
                              <strong className="font-semibold text-slate-900">
                                {isProgram ? 'Medverkande:' : 'Gäller:'}
                              </strong>{' '}
                              {ev.speakers.length > 0
                                ? ev.speakers
                                    .map((s) => `${s.name}${s.mode === 'remote' ? ' (på distans)' : ''}`)
                                    .join(', ')
                                : 'Ingen vald'}

                            {isProgram && ev.material && (
                              <span className="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-indigo-50 text-indigo-700 border border-indigo-200">
                                Material: {ev.material}
                              </span>
                            )}
                            {ev.extraNote && (
                              <span className="text-slate-600">· {ev.extraNote}</span>
                            )}
                          </div>
                        )}

                        {/* Inline-redigering när kortet är expanderat */}
                        {isExpanded && (
                          <div className="mt-3 pt-3 border-t border-slate-200/80 space-y-3">
                            <div
                              className={`grid grid-cols-1 ${
                                isProgram ? 'md:grid-cols-3' : 'md:grid-cols-2'
                              } gap-3`}
                            >
                              <div>
                                <label className="block text-xs font-semibold text-slate-800 mb-1">
                                  Rubrik
                                </label>
                                <input
                                  type="text"
                                  className="w-full px-3 py-2 rounded-xl border border-slate-300 bg-white text-slate-900 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                                  value={ev.title}
                                  onChange={(e) =>
                                    handleUpdateEvent(ev.id, { title: e.target.value })
                                  }
                                />
                              </div>

                              {isProgram ? (
                                <>
                                  <div>
                                    <label className="block text-xs font-semibold text-slate-800 mb-1">
                                      Längd (minuter)
                                    </label>

                                      type="number"
                                      min="0"
                                      max="360"
                                      className="w-full px-3 py-2 rounded-xl border border-slate-300 bg-white text-slate-900 text-sm tabular-nums focus:outline-none focus:ring-2 focus:ring-indigo-500"
                                      value={ev.durationMinutes}
                                      onChange={(e) =>
                                        handleUpdateEvent(ev.id, {
                                          durationMinutes: Math.max(0, Number(e.target.value) || 0),
                                        })
                                      }
                                    />
                                  </div>

                                  <div>
                                    <label className="block text-xs font-semibold text-slate-800 mb-1">
                                      Presentationsmaterial (t.ex. Master PPT eller Menti)
                                    </label>
                                    <input
                                      type="text"
                                      className="w-full px-3 py-2 rounded-xl border border-slate-300 bg-white text-slate-900 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                                      value={ev.material || ''}
                                      onChange={(e) =>
                                        handleUpdateEvent(ev.id, { material: e.target.value })
                                      }
                                      placeholder="T.ex. Master PPT"
                                    />
                                    <div className="flex flex-wrap gap-1.5 mt-1.5">
                                      {PRESENTATION_PRESETS.map((preset) => (
                                        <button
                                          key={preset}
                                          type="button"
                                          onClick={() =>
                                            handleUpdateEvent(ev.id, { material: preset })
                                          }
                                          className={`px-2 py-0.5 rounded-lg text-xs font-medium border transition-colors ${
                                            ev.material === preset
                                              ? 'bg-indigo-600 border-indigo-600 text-white'
                                              : 'bg-white border-slate-300 text-slate-600 hover:bg-slate-50'
                                          }`}
                                        >
                                          {preset}
                                        </button>
                                      ))}
                                    </div>
                                  </div>
                                </>
                              ) : (
                                <div>
                                  <label className="block text-xs font-semibold text-slate-800 mb-1">
                                    Typ av händelse
                                  </label>
                                  <select
                                    className="w-full px-3 py-2 rounded-xl border border-slate-300 bg-white text-slate-900 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                                    value={ev.action || 'enter'}
                                    onChange={(e) => {
                                      const nextAct = e.target.value;
                                      const names = ev.speakers.map((s) => s.name.split(' ')[0]);
                                      const prefix =
                                        names.length > 0 ? names.join(' + ') : 'Deltagare';
                                      const suggested =
                                        nextAct === 'enter' ? `${prefix} på` : `${prefix} av`;
                                      handleUpdateEvent(ev.id, {
                                        action: nextAct,
                                        title: suggested,
                                      });
                                    }}
                                  >
                                    <option value="enter">Person går på</option>
                                    <option value="exit">Person går av</option>
                                  </select>
                                </div>
                              )}
                            </div>

                            <div>
                              <span className="block text-xs font-semibold text-slate-800 mb-1.5">
                                {isProgram ? 'Vem/vilka talar under programpunkten' : 'Välj deltagare'}
                              </span>
                              {state.participants.length === 0 ? (
                                <p className="text-xs text-slate-600">
                                  Lägg till deltagare i steg 2 för att koppla dem hit.
                                </p>
                              ) : (
                                <div className="flex flex-wrap gap-1.5">
                                  {state.participants.map((p) => {
                                    const selected = (ev.speakerIds || []).includes(p.id);
                                    return (
                                      <button
                                        key={p.id}
                                        type="button"
                                        onClick={() => handleToggleEventSpeaker(ev.id, p.id)}
                                        className={`px-3 py-1.5 rounded-full text-xs font-semibold border transition-colors ${
                                          selected
                                            ? 'bg-indigo-600 border-indigo-600 text-white'
                                            : 'bg-white border-slate-300 text-slate-700 hover:bg-slate-50'
                                        }`}
                                      >
                                        {p.name}
                                        {p.mode === 'remote' ? ' (på distans)' : ''}
                                      </button>
                                    );
                                  })}
                                </div>
                              )}
                            </div>

                            <div>
                              <label className="block text-xs font-semibold text-slate-800 mb-1">
                                Tekniska kommentarer och tid för anslutning
                              </label>
                              <input
                                type="text"
                                className="w-full px-3 py-2 rounded-xl border border-slate-300 bg-white text-slate-900 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                                value={ev.extraNote || ''}
                                onChange={(e) =>
                                  handleUpdateEvent(ev.id, { extraNote: e.target.value })
                                }
                                placeholder="T.ex. Ansluter på distans 15 min före eller särskild anvisning"
                              />
                            </div>
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          </section>
        );
      }

                      <tr>
                        <th colSpan={2} className="excel-th">På plats eller på distans</th>
                        <th colSpan={2} className="excel-th">Namn (i den ordning de medverkar i programmet!)</th>
                        <th className="excel-th">Organisation</th>
                        <th className="excel-th">Mail till distansmedverkande</th>
                        <th className="excel-th">Mobilnummer till distansmedverkande</th>
                        <th className="excel-th">Datum och tid för teknikgenomgång</th>
                      </tr>
                      {Array.from({ length: previewParticipantRows }).map((_, idx) => {
                        const p = scheduleAnalysis.orderedParticipants[idx] || null;
                        return (
                          <tr key={`xls-p-${idx}`}>
                            <td colSpan={2}>
                              {p
                                ? `${p.mode === 'remote' ? 'På distans' : 'På plats'}${
                                    p.mode === 'studio' && p.assignedMic ? ` (${p.assignedMic})` : ''
                                  }`
                                : ''}
                            </td>
                            <td colSpan={2} style={{ fontWeight: p ? 700 : 400 }}>
                              {p ? `${idx + 1}. ${p.name}` : `${idx + 1}. `}
                            </td>
                            <td>{p ? [p.organization, p.role].filter(Boolean).join(' – ') : ''}</td>
                            <td>{p && p.mode === 'remote' ? p.email || '' : ''}</td>
                            <td>{p && p.mode === 'remote' ? p.mobile || '' : ''}</td>
                            <td>{p && p.mode === 'remote' ? p.techCheck || '' : ''}</td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </section>
        );
      }

      return (
        <AppErrorBoundary>
          {/* Toppheader med tydliga stegflikar och enbart "Börja ny (rensa)" */}
          <header className="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-2xs">
            <div className="max-w-6xl mx-auto px-4 sm:px-6 pt-4">
              <div className="flex flex-wrap items-center justify-between gap-3 pb-4">
                <div className="flex items-center gap-3">
                  <div className="w-10 h-10 rounded-xl bg-indigo-600 text-white flex items-center justify-center font-bold text-lg shadow-xs">
                    K
                  </div>
                  <div>
                    <h1 className="text-xl sm:text-2xl font-bold text-slate-900 tracking-tight">
                      Körschema Studio
                    </h1>
                    <p className="text-xs sm:text-sm text-slate-600">
                      Planering av sändning, deltagare och körschema
                    </p>
                  </div>
                </div>

                <button
                  type="button"
                  onClick={handleClearAll}
                  className="px-3.5 py-2 rounded-xl border border-slate-300 bg-white text-slate-700 text-xs sm:text-sm font-semibold hover:bg-slate-50 hover:text-rose-600 hover:border-rose-300 transition-colors"
                >
                  Börja ny (rensa)
                </button>
              </div>

              {/* 4 klickbara stegflikar med rena stegnummer */}
              <nav
                aria-label="Steg i Körschema Studio"
                className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-2"
              >
                {STEPS.map((st) => {
                  const isActive = activeStep === st.id;
                  let countBadge = null;
                  if (st.id === 2) {
                    countBadge = `${state.participants.length} st`;
                  } else if (st.id === 3) {
                    countBadge = `${state.events.length} st`;
                  }

                  return (
                    <button
                      key={st.id}
                      type="button"
                      aria-current={isActive ? 'step' : undefined}
                      onClick={() => setActiveStep(st.id)}
                      className={`flex items-center gap-2.5 px-3.5 py-2.5 rounded-t-xl border border-b-2 text-left text-sm font-semibold transition-colors ${
                        isActive
                          ? 'bg-slate-50 text-indigo-700 border-slate-200 border-b-indigo-600'
                          : 'bg-white text-slate-600 border-transparent hover:bg-slate-50 hover:text-slate-900'
                      }`}
                    >
                      <span
                        className={`w-6 h-6 rounded-full inline-flex items-center justify-center text-xs font-bold shrink-0 tabular-nums ${
                          isActive
                            ? 'bg-indigo-600 text-white'
                            : 'bg-slate-200 text-slate-700'
                        }`}
                      >
                        {st.id}
                      </span>
                      <span className="truncate">{st.label}</span>
                      {countBadge && (
                        <span className="ml-auto px-2 py-0.5 rounded-full text-xs font-semibold bg-slate-100 text-slate-700 tabular-nums shrink-0">
                          {countBadge}
                        </span>
                      )}
                    </button>
                  );
                })}
              </nav>
            </div>
          </header>

          {/* Huvudinnehåll */}
          <main className="max-w-6xl mx-auto px-4 sm:px-6 py-6 pb-16">
            {activeStep === 1 && renderStep1Brief()}
            {activeStep === 2 && renderStep2Participants()}
            {activeStep === 3 && renderStep3Schedule()}
            {activeStep === 4 && renderStep4ReviewAndExport()}

            {/* Steg-navigering längst ner */}
            <div className="flex flex-wrap items-center justify-between gap-3 mt-6 pt-4 border-t border-slate-200">
              <button
                type="button"
                disabled={activeStep === 1}
                onClick={() => setActiveStep((s) => Math.max(1, s - 1))}
                className="px-4 py-2.5 rounded-xl border border-slate-300 bg-white text-slate-700 text-sm font-semibold hover:bg-slate-50 disabled:opacity-40 transition-colors"
              >
                ← Föregående steg
              </button>

              <span className="text-sm font-medium text-slate-600 tabular-nums">
                Steg {activeStep} av {STEPS.length}
              </span>

              {activeStep < 4 ? (
                <button
                  type="button"
                  onClick={() => setActiveStep((s) => Math.min(4, s + 1))}
                  className="px-4 py-2.5 rounded-xl bg-indigo-600 text-white text-sm font-semibold hover:bg-indigo-700 transition-colors shadow-xs"
                >
                  Nästa steg →
                </button>
              ) : (
                <button
                  type="button"
                  disabled={exportingXlsx}
                  onClick={handleExportExcel}
                  className="px-4 py-2.5 rounded-xl bg-indigo-600 text-white text-sm font-semibold hover:bg-indigo-700 disabled:opacity-50 transition-colors shadow-xs"
                >
                  {exportingXlsx ? 'Genererar .xlsx...' : 'Ladda ner Excel (.xlsx)'}
                </button>
              )}
            </div>
          </main>

          {/* Diskret ångra- / statusbanner */}
          {toastMsg && (
            <div
              role="status"
              aria-live="polite"
              className="fixed bottom-5 right-5 z-50 max-w-md bg-slate-900 text-white rounded-2xl px-4 py-3 shadow-lg flex items-center gap-3 text-sm"
            >
              <span>{toastMsg}</span>
              {undoSnapshot && (
                <button
                  type="button"
                  onClick={handleUndo}
                  className="px-3 py-1 rounded-lg bg-indigo-500 hover:bg-indigo-400 text-white text-xs font-semibold shrink-0"
                >
                  Ångra
                </button>
              )}
            </div>
          )}
        </AppErrorBoundary>
      );
    }

    (function mountApp() {
      const fallbackEl = document.getElementById('cdn-fallback');
      if (fallbackEl) {
        fallbackEl.style.display = 'none';
      }
      const rootNode = document.getElementById('root');
      if (rootNode && window.ReactDOM && window.ReactDOM.createRoot) {
        const root = window.ReactDOM.createRoot(rootNode);
        root.render(<KorschemaStudioApp />);
      }
    })();
  </script>
</body>
</html>
