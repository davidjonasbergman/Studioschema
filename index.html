<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Körschema Studio</title>

  <!-- Google Font: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    if (window.tailwind) {
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
            },
          },
        },
      };
    }
  </script>

  <style>
    body {
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
      -webkit-font-smoothing: antialiased;
    }

    .tabular-nums {
      font-variant-numeric: tabular-nums;
    }

    /* Excel-förhandsvisning i Steg 4 */
    .excel-sheet-table {
      width: 100%;
      min-width: 1020px;
      border-collapse: collapse;
      font-family: Calibri, 'Segoe UI', Arial, sans-serif;
      font-size: 13px;
      color: #0f172a;
    }

    .excel-sheet-table th,
    .excel-sheet-table td {
      border: 1px solid #808080;
      padding: 6px 8px;
      vertical-align: middle;
      text-align: left;
    }

    .excel-banner {
      background-color: #595959;
      color: #ffffff;
      font-weight: 700;
      font-size: 17px;
      padding: 10px;
    }

    .excel-th {
      background-color: #595959;
      color: #ffffff;
      font-weight: 700;
      font-size: 12.5px;
    }

    .excel-prog {
      background-color: #fac090;
      color: #0f172a;
    }

    .excel-enter {
      background-color: #d8e4bc;
      color: #0f172a;
      font-weight: 600;
    }

    .excel-exit {
      background-color: #e6b8b7;
      color: #0f172a;
      font-weight: 600;
    }

    .excel-mic-cell {
      background-color: #d8e4bc;
      color: #0f172a;
      font-weight: 700;
    }

    .excel-buffer-cell {
      background-color: #ffffff;
      color: #64748b;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col">

  <!-- =======================================================================
       TOPPHEADER & STEGFLIKAR
       ======================================================================= -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-2xs">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 pt-4">
      <div class="flex flex-wrap items-center justify-between gap-3 pb-4">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl bg-indigo-600 text-white flex items-center justify-center font-bold text-lg shadow-xs shrink-0">
            K
          </div>
          <div>
            <h1 class="text-xl sm:text-2xl font-bold text-slate-900 tracking-tight">
              Körschema Studio
            </h1>
            <p class="text-xs sm:text-sm text-slate-600">
              Planera sändning och exportera färdigt körschema till Excel
            </p>
          </div>
        </div>

        <button
          id="btn-clear-all"
          type="button"
          class="px-3.5 py-2 rounded-xl border border-slate-300 bg-white text-slate-700 text-xs sm:text-sm font-semibold hover:bg-slate-50 hover:text-rose-600 hover:border-rose-300 transition-colors cursor-pointer"
        >
          Börja ny (rensa)
        </button>
      </div>

      <!-- 4 klickbara stegflikar med rena stegnummer 1-4 (inga gröna bockar) -->
      <nav
        id="stepper-nav"
        aria-label="Steg i Körschema Studio"
        class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-2"
      ></nav>
    </div>
  </header>

  <!-- =======================================================================
       HUVUDINNEHÅLL
       ======================================================================= -->
  <main class="max-w-6xl w-full mx-auto px-4 sm:px-6 py-6 pb-16 flex-1">
    <div id="step-container"></div>

    <!-- Steg-navigering längst ner -->
    <div class="flex flex-wrap items-center justify-between gap-3 mt-6 pt-4 border-t border-slate-200">
      <button
        id="btn-prev-step"
        type="button"
        class="px-4 py-2.5 rounded-xl border border-slate-300 bg-white text-slate-700 text-sm font-semibold hover:bg-slate-50 disabled:opacity-40 disabled:cursor-not-allowed transition-colors cursor-pointer"
      >
        ← Föregående steg
      </button>

      <span id="step-indicator-text" class="text-sm font-medium text-slate-600 tabular-nums">
        Steg 1 av 4
      </span>

      <button
        id="btn-next-step"
        type="button"
        class="px-4 py-2.5 rounded-xl bg-indigo-600 text-white text-sm font-semibold hover:bg-indigo-700 disabled:opacity-50 transition-colors shadow-xs cursor-pointer"
      >
        Nästa steg →
      </button>
    </div>
  </main>

  <!-- =======================================================================
       TOAST / ÅNGRA-BANNER (8 SEKUNDER)
       ======================================================================= -->
  <div
    id="toast-banner"
    role="status"
    aria-live="polite"
    class="hidden fixed bottom-5 right-5 z-50 max-w-md bg-slate-900 text-white rounded-2xl px-4 py-3 shadow-lg flex items-center gap-3 text-sm"
  >
    <span id="toast-message"></span>
    <button
      id="btn-undo-toast"
      type="button"
      class="hidden px-3 py-1 rounded-lg bg-indigo-500 hover:bg-indigo-400 text-white text-xs font-semibold shrink-0 cursor-pointer"
    >
      Ångra rensning
    </button>
  </div>

  <!-- =======================================================================
       APPLIKATIONSLOGIK (100% VANILLA JAVASCRIPT, INGEN RUNTIME TRANSPILERING)
       ======================================================================= -->
  <script>
    (function () {
      'use strict';

      // -----------------------------------------------------------------------
      // 1. KONSTANTER & ASYNKRON LADDNING AV EXCELJS
      // -----------------------------------------------------------------------
      const STORAGE_KEY = 'korschema_studio_prod_v3';

      const STEPS = [
        { id: 1, label: '1. Sändningsbrief' },
        { id: 2, label: '2. Deltagarlista' },
        { id: 3, label: '3. Körschema' },
        { id: 4, label: '4. Granska & Exportera' },
      ];

      const RECORDING_OPTIONS = [
        'Ja, 14 dagar',
        'Ja, 30 dagar',
        'Ja, mer än 30 dagar',
        'Nej',
      ];

      const PRESENTATION_PRESETS = [
        'Master PPT',
        'PowerPoint',
        'Menti',
        'Video/klipp',
      ];

      let excelJsPromise = null;

      function ensureExcelJS() {
        if (window.ExcelJS) {
          return Promise.resolve(window.ExcelJS);
        }
        if (excelJsPromise) {
          return excelJsPromise;
        }
        excelJsPromise = new Promise(function (resolve, reject) {
          const urls = [
            'https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js',
            'https://unpkg.com/exceljs@4.4.0/dist/exceljs.min.js',
          ];

          function loadScriptAt(index) {
            if (index >= urls.length) {
              excelJsPromise = null;
              reject(new Error('Kunde inte hämta ExcelJS från CDN.'));
              return;
            }
            const script = document.createElement('script');
            script.src = urls[index];
            script.async = true;
            script.onload = function () {
              if (window.ExcelJS) {
                resolve(window.ExcelJS);
              } else {
                loadScriptAt(index + 1);
              }
            };
            script.onerror = function () {
              loadScriptAt(index + 1);
            };
            document.head.appendChild(script);
          }

          loadScriptAt(0);
        });
        return excelJsPromise;
      }

      // Förladda ExcelJS i bakgrunden utan att blockera sidrendering
      ensureExcelJS().catch(function () {
        // Ignorera här; hanteras vid klick på exportknappen
      });

      // -----------------------------------------------------------------------
      // 2. HJÄLPFUNKTIONER FÖR DATUM, TID & ESCAPING
      // -----------------------------------------------------------------------
      function escapeHtml(value) {
        return String(value == null ? '' : value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function getDefaultDateAndTimes() {
        const now = new Date();
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const day = String(now.getDate()).padStart(2, '0');
        const dateStr = `${year}-${month}-${day}`;

        const totalCurrentMinutes = now.getHours() * 60 + now.getMinutes();
        const roundedStartMinutes = Math.round(totalCurrentMinutes / 30) * 30;
        const startNorm = ((roundedStartMinutes % 1440) + 1440) % 1440;
        const endNorm = (startNorm + 60) % 1440;

        const startHH = String(Math.floor(startNorm / 60)).padStart(2, '0');
        const startMM = String(startNorm % 60).padStart(2, '0');
        const endHH = String(Math.floor(endNorm / 60)).padStart(2, '0');
        const endMM = String(endNorm % 60).padStart(2, '0');

        return {
          date: dateStr,
          startTime: `${startHH}:${startMM}`,
          endTime: `${endHH}:${endMM}`,
        };
      }

      function createFreshState() {
        const dt = getDefaultDateAndTimes();
        return {
          brief: {
            templateTitle: 'Quickchannel körschema på 4F',
            title: '',
            date: dt.date,
            startTime: dt.startTime,
            endTime: dt.endTime,
            handler: '',
            phone: '',
            email: '',
            chatEnabled: 'Ja',
            recordingAvailable: 'Ja, 30 dagar',
            description: '',
          },
          participants: [],
          events: [],
        };
      }

      function parseHHMM(timeStr) {
        if (!timeStr || !/^\d{1,2}:\d{2}$/.test(timeStr.trim())) {
          return 13 * 60;
        }
        const parts = timeStr.trim().split(':').map(Number);
        const h = parts[0];
        const m = parts[1];
        if (Number.isNaN(h) || Number.isNaN(m)) return 13 * 60;
        return h * 60 + m;
      }

      function formatMinutesHHMM(totalMinutes) {
        const safe = Math.max(0, Math.round(totalMinutes));
        const minsOfDay = safe % 1440;
        const h = Math.floor(minsOfDay / 60);
        const m = minsOfDay % 60;
        return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
      }

      function formatSwedishDateDisplay(dateStr, startTime, endTime) {
        const months = [
          'januari', 'februari', 'mars', 'april', 'maj', 'juni',
          'juli', 'augusti', 'september', 'oktober', 'november', 'december',
        ];
        let datePart = dateStr || '';
        if (/^\d{4}-\d{2}-\d{2}$/.test(dateStr || '')) {
          const parts = dateStr.split('-').map(Number);
          const dt = new Date(Date.UTC(parts[0], parts[1] - 1, parts[2]));
          if (!Number.isNaN(dt.getTime())) {
            datePart = `${dt.getUTCDate()} ${months[dt.getUTCMonth()]}`;
          }
        }
        const timePart =
          startTime && endTime
            ? `${startTime}–${endTime}`
            : startTime || endTime || '';
        return [datePart, timePart].filter(Boolean).join(' ');
      }

      function computePlannedBroadcastDuration(dateStr, startTime, endTime) {
        const startMin = parseHHMM(startTime);
        const endMin = parseHHMM(endTime);

        let diffMinutes = endMin - startMin;
        if (diffMinutes < 0) {
          diffMinutes += 1440;
        }

        const hours = Math.floor(diffMinutes / 60);
        const mins = diffMinutes % 60;

        let humanText = `${diffMinutes} min`;
        if (hours > 0 && mins > 0) {
          humanText = `${hours} tim ${mins} min (${diffMinutes} min)`;
        }

        return {
          totalMinutes: diffMinutes,
          humanText: humanText,
          endMinutesAbsolute: startMin + diffMinutes,
        };
      }

      function analyzeScheduleAndMics(brief, participants, events) {
        const participantById = new Map(participants.map(function (p) { return [p.id, p]; }));
        const micByParticipantId = new Map();
        const appearanceOrder = [];
        let nextStudioMicNumber = 1;

        // 1. Tilldela MIK 1, MIK 2 osv. till deltagare "På plats" utifrån ordningen i körschemat
        events.forEach(function (ev) {
          const ids = Array.isArray(ev.speakerIds) ? ev.speakerIds : [];
          ids.forEach(function (id) {
            const person = participantById.get(id);
            if (!person) return;
            if (!appearanceOrder.includes(id)) {
              appearanceOrder.push(id);
            }
            if (person.mode === 'studio' && !micByParticipantId.has(id)) {
              micByParticipantId.set(id, `MIK ${nextStudioMicNumber}`);
              nextStudioMicNumber += 1;
            }
          });
        });

        // 2. Ge övriga deltagare "På plats" (som inte lagts in i schemat ännu) nästkommande MIK-nummer
        participants.forEach(function (p) {
          if (p.mode === 'studio' && !micByParticipantId.has(p.id)) {
            micByParticipantId.set(p.id, `MIK ${nextStudioMicNumber}`);
            nextStudioMicNumber += 1;
          }
        });

        // 3. Sortera deltagarlistan i programordning följt av övriga deltagare
        const orderedParticipants = [];
        const seen = new Set();
        appearanceOrder.forEach(function (id) {
          const p = participantById.get(id);
          if (p && !seen.has(id)) {
            seen.add(id);
            orderedParticipants.push(Object.assign({}, p, {
              assignedMic: micByParticipantId.get(id) || '',
            }));
          }
        });
        participants.forEach(function (p) {
          if (!seen.has(p.id)) {
            seen.add(p.id);
            orderedParticipants.push(Object.assign({}, p, {
              assignedMic: micByParticipantId.get(p.id) || '',
            }));
          }
        });

        let cursorMinutes = parseHHMM(brief.startTime);

        const computedEvents = events.map(function (ev, index) {
          const validIds = (ev.speakerIds || []).filter(function (id) {
            return participantById.has(id);
          });
          const speakers = validIds.map(function (id) {
            return participantById.get(id);
          });

          const evMics = [];
          validIds.forEach(function (id) {
            const mic = micByParticipantId.get(id);
            if (mic && !evMics.includes(mic)) {
              evMics.push(mic);
            }
          });
          const autoMicText = evMics.join(' + ');

          let startFormatted = '';
          let endFormatted = '';
          let startMin = null;
          let endMin = null;
          let durationMin = 0;

          if (ev.type === 'program') {
            durationMin = Math.max(0, Number(ev.durationMinutes) || 0);
            startMin = cursorMinutes;
            endMin = cursorMinutes + durationMin;
            startFormatted = formatMinutesHHMM(startMin);
            endFormatted = formatMinutesHHMM(endMin);
            cursorMinutes = endMin;
          }

          return Object.assign({}, ev, {
            index: index,
            speakers: speakers,
            startMin: startMin,
            endMin: endMin,
            startFormatted: startFormatted,
            endFormatted: endFormatted,
            durationMin: durationMin,
            autoMicText: autoMicText,
          });
        });

        const programEvents = computedEvents.filter(function (e) {
          return e.type === 'program';
        });
        const totalProgramMinutes = programEvents.reduce(function (acc, e) {
          return acc + e.durationMin;
        }, 0);
        const scheduledEndFormatted = formatMinutesHHMM(cursorMinutes);

        return {
          computedEvents: computedEvents,
          micByParticipantId: micByParticipantId,
          orderedParticipants: orderedParticipants,
          programCount: programEvents.length,
          totalProgramMinutes: totalProgramMinutes,
          scheduledEndMinutes: cursorMinutes,
          scheduledEndFormatted: scheduledEndFormatted,
        };
      }

      // -----------------------------------------------------------------------
      // 3. APPLIKATIONENS TILLSTÅND (STATE) & LOCALSTORAGE
      // -----------------------------------------------------------------------
      function loadInitialState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (
              parsed &&
              parsed.brief &&
              Array.isArray(parsed.participants) &&
              Array.isArray(parsed.events)
            ) {
              return parsed;
            }
          }
        } catch (e) {
          // Ignorera lagringsfel
        }
        return createFreshState();
      }

      let appData = loadInitialState();

      const uiState = {
        activeStep: 1,
        advancedOpen: false,
        editingParticipantId: null,
        partForm: {
          name: '',
          organization: '',
          role: '',
          mode: 'studio',
          email: '',
          mobile: '',
          error: '',
        },
        expandedEventId: null,
        draggedIndex: null,
        dragOverIndex: null,
        exportingXlsx: false,
        undoSnapshot: null,
        toastTimer: null,
      };

      function persistData() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
        } catch (e) {
          // Ignorera lagringsfel
        }
      }

      // -----------------------------------------------------------------------
      // 4. TOAST & ÅNGRA RENSA-HANTERING
      // -----------------------------------------------------------------------
      const toastBannerEl = document.getElementById('toast-banner');
      const toastMessageEl = document.getElementById('toast-message');
      const btnUndoToastEl = document.getElementById('btn-undo-toast');

      function showToast(message, snapshotForUndo) {
        if (uiState.toastTimer) {
          clearTimeout(uiState.toastTimer);
        }
        toastMessageEl.textContent = message;
        if (snapshotForUndo) {
          uiState.undoSnapshot = snapshotForUndo;
          btnUndoToastEl.classList.remove('hidden');
        } else {
          uiState.undoSnapshot = null;
          btnUndoToastEl.classList.add('hidden');
        }
        toastBannerEl.classList.remove('hidden');

        uiState.toastTimer = setTimeout(function () {
          toastBannerEl.classList.add('hidden');
          uiState.undoSnapshot = null;
        }, 8000);
      }

      btnUndoToastEl.addEventListener('click', function () {
        if (!uiState.undoSnapshot) return;
        appData = uiState.undoSnapshot;
        uiState.undoSnapshot = null;
        toastBannerEl.classList.add('hidden');
        if (uiState.toastTimer) clearTimeout(uiState.toastTimer);
        persistData();
        renderAll();
      });

      document.getElementById('btn-clear-all').addEventListener('click', function () {
        const previousSnapshot = JSON.parse(JSON.stringify(appData));
        appData = createFreshState();
        uiState.editingParticipantId = null;
        uiState.partForm = {
          name: '',
          organization: '',
          role: '',
          mode: 'studio',
          email: '',
          mobile: '',
          error: '',
        };
        uiState.expandedEventId = null;
        uiState.activeStep = 1;
        persistData();
        renderAll();
        showToast('Formuläret har rensats till ett nytt utkast.', previousSnapshot);
      });

      // -----------------------------------------------------------------------
      // 5. STEPPER & BOTTOM NAVIGATION
      // -----------------------------------------------------------------------
      const stepperNavEl = document.getElementById('stepper-nav');
      const stepContainerEl = document.getElementById('step-container');
      const btnPrevStepEl = document.getElementById('btn-prev-step');
      const btnNextStepEl = document.getElementById('btn-next-step');
      const stepIndicatorTextEl = document.getElementById('step-indicator-text');

      function renderStepper() {
        stepperNavEl.innerHTML = STEPS.map(function (st) {
          const isActive = uiState.activeStep === st.id;
          let badgeHtml = '';
          if (st.id === 2) {
            badgeHtml = `<span id="nav-badge-2" class="ml-auto px-2 py-0.5 rounded-full text-xs font-semibold bg-slate-100 text-slate-700 tabular-nums shrink-0">${appData.participants.length} st</span>`;
          } else if (st.id === 3) {
            badgeHtml = `<span id="nav-badge-3" class="ml-auto px-2 py-0.5 rounded-full text-xs font-semibold bg-slate-100 text-slate-700 tabular-nums shrink-0">${appData.events.length} st</span>`;
          }

          const btnClass = isActive
            ? 'bg-slate-50 text-indigo-700 border-slate-200 border-b-indigo-600'
            : 'bg-white text-slate-600 border-transparent hover:bg-slate-50 hover:text-slate-900';

          const numClass = isActive
            ? 'bg-indigo-600 text-white'
            : 'bg-slate-200 text-slate-700';

          return `
            <button
              type="button"
              data-step-target="${st.id}"
              aria-current="${isActive ? 'step' : 'false'}"
              class="flex items-center gap-2.5 px-3.5 py-2.5 rounded-t-xl border border-b-2 text-left text-sm font-semibold transition-colors cursor-pointer ${btnClass}"
            >
              <span class="w-6 h-6 rounded-full inline-flex items-center justify-center text-xs font-bold shrink-0 tabular-nums ${numClass}">
                ${st.id}
              </span>
              <span class="truncate">${escapeHtml(st.label)}</span>
              ${badgeHtml}
            </button>
          `;
        }).join('');

        stepperNavEl.querySelectorAll('button[data-step-target]').forEach(function (btn) {
          btn.addEventListener('click', function () {
            uiState.activeStep = Number(btn.getAttribute('data-step-target'));
            renderAll();
            window.scrollTo({ top: 0, behavior: 'smooth' });
          });
        });
      }

      function renderBottomNav() {
        btnPrevStepEl.disabled = uiState.activeStep === 1;
        stepIndicatorTextEl.textContent = `Steg ${uiState.activeStep} av ${STEPS.length}`;

        if (uiState.activeStep < 4) {
          btnNextStepEl.textContent = 'Nästa steg →';
          btnNextStepEl.disabled = false;
        } else {
          btnNextStepEl.textContent = uiState.exportingXlsx
            ? 'Genererar .xlsx...'
            : 'Ladda ner Excel (.xlsx)';
          btnNextStepEl.disabled = uiState.exportingXlsx;
        }
      }

      btnPrevStepEl.addEventListener('click', function () {
        if (uiState.activeStep > 1) {
          uiState.activeStep -= 1;
          renderAll();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }
      });

      btnNextStepEl.addEventListener('click', function () {
        if (uiState.activeStep < 4) {
          uiState.activeStep += 1;
          renderAll();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        } else {
          handleExportExcel();
        }
      });

      // -----------------------------------------------------------------------
      // 6. STEG 1: SÄNDNINGSBRIEF
      // -----------------------------------------------------------------------
      function renderStep1() {
        const b = appData.brief;
        const recOptionsHtml = RECORDING_OPTIONS.map(function (opt) {
          return `<option value="${escapeHtml(opt)}" ${b.recordingAvailable === opt ? 'selected' : ''}>${escapeHtml(opt)}</option>`;
        }).join('');

        stepContainerEl.innerHTML = `
          <section aria-labelledby="step1-heading">
            <div class="bg-white border border-slate-200 rounded-2xl p-5 sm:p-6 shadow-sm">
              <div class="pb-4 mb-5 border-b border-slate-200">
                <h2 id="step1-heading" class="text-xl font-bold text-slate-900">
                  1. Sändningsbrief
                </h2>
                <p class="text-sm text-slate-600 mt-1">
                  Fyll i grunduppgifter för sändningen. Total sändningslängd beräknas automatiskt till sammanställningen och Excel-filen utifrån datum, starttid och sluttid.
                </p>
              </div>

              <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                <div>
                  <label for="brief-title" class="block text-sm font-semibold text-slate-800 mb-1.5">
                    Sändningens namn (som publicerad)
                  </label>
                  <input
                    id="brief-title"
                    type="text"

        // Koppla inputlyssnare (uppdaterar state utan att rita om inputfältet mitt i skrivandet)
        const fieldBindings = [
          ['brief-title', 'title'],
          ['brief-template-title', 'templateTitle'],
          ['brief-date', 'date'],
          ['brief-start', 'startTime'],
          ['brief-end', 'endTime'],

          ['brief-desc', 'description'],

        fieldBindings.forEach(function (pair) {
          const el = document.getElementById(pair[0]);
          if (!el) return;
          const evtName = el.tagName === 'SELECT' ? 'change' : 'input';
          el.addEventListener(evtName, function () {
            appData.brief[pair[1]] = el.value;
            persistData();

        document.getElementById('btn-toggle-advanced').addEventListener('click', function () {
          uiState.advancedOpen = !uiState.advancedOpen;
          renderStep1();

      // -----------------------------------------------------------------------
      // 7. STEG 2: DELTAGARLISTA
      // -----------------------------------------------------------------------
      function resetParticipantForm() {
        uiState.editingParticipantId = null;
        uiState.partForm = {
          name: '',
          organization: '',
          role: '',
          mode: 'studio',
          email: '',
          mobile: '',
          error: '',
        };
      }

      function renderStep2() {
        const remoteCount = appData.participants.filter(function (p) {
          return p.mode === 'remote';
        }).length;
        const studioCount = appData.participants.length - remoteCount;
        const f = uiState.partForm;

        const listHtml =
          appData.participants.length === 0
            ? `<div class="p-6 rounded-xl border border-dashed border-slate-300 bg-slate-50 text-sm text-slate-600">
                Inga deltagare tillagda ännu. Fyll i formuläret ovan för att lägga till medverkande.
              </div>`
            : `<div class="space-y-2.5">
                ${appData.participants
                  .map(function (person) {
                    const isRemote = person.mode === 'remote';
                    const badgeClass = isRemote
                      ? 'bg-blue-100 text-blue-800'
                      : 'bg-emerald-100 text-emerald-800';
                    const badgeLabel = isRemote ? 'På distans' : 'På plats';
                    const subtitle =
                      [person.organization, person.role].filter(Boolean).join(' · ') ||
                      'Ingen organisation angiven';
                    const remoteInfo = isRemote
                      ? [person.email, person.mobile].filter(Boolean).join(' · ')
                      : '';

                    return `
                      <div class="flex flex-wrap items-center justify-between gap-3 p-3.5 rounded-xl border border-slate-200 bg-slate-50/70 hover:bg-white transition-colors">
                        <div>
                          <div class="flex flex-wrap items-center gap-2">
                            <span class="font-semibold text-slate-900 text-sm sm:text-base">
                              ${escapeHtml(person.name)}
                            </span>
                            <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold ${badgeClass}">
                              ${badgeLabel}
                            </span>
                          </div>
                          <div class="text-xs sm:text-sm text-slate-600 mt-0.5">
                            ${escapeHtml(subtitle)}
                          </div>
                          ${
                            remoteInfo
                              ? `<div class="text-xs text-blue-700 font-medium mt-1">${escapeHtml(remoteInfo)}</div>`
                              : ''
                          }
                        </div>

                        <div class="flex items-center gap-2">
                          <button
                            type="button"
                            data-edit-person="${escapeHtml(person.id)}"
                            class="px-3 py-1.5 rounded-lg border border-slate-300 bg-white text-slate-700 text-xs font-semibold hover:bg-slate-50 transition-colors cursor-pointer"
                          >
                            Redigera
                          </button>
                          <button
                            type="button"
                            data-delete-person="${escapeHtml(person.id)}"
                            aria-label="Ta bort ${escapeHtml(person.name)}"
                            class="px-3 py-1.5 rounded-lg text-rose-600 hover:bg-rose-50 text-xs font-semibold transition-colors cursor-pointer"
                          >
                            Ta bort
                          </button>
                        </div>
                      </div>
                    `;
                  })
                  .join('')}
              </div>`;

        stepContainerEl.innerHTML = `
          <section aria-labelledby="step2-heading">
            <div class="bg-white border border-slate-200 rounded-2xl p-5 sm:p-6 shadow-sm">
              <div class="flex flex-wrap items-start justify-between gap-3 pb-4 mb-5 border-b border-slate-200">
                <div>
                  <h2 id="step2-heading" class="text-xl font-bold text-slate-900">
                    2. Deltagarlista
                  </h2>
                  <p class="text-sm text-slate-600 mt-1">
                    Registrera alla medverkande som deltar på plats eller på distans. Mikrofonkanaler tilldelas automatiskt utifrån körschemat.
                  </p>
                </div>

                <div class="flex flex-wrap items-center gap-2">
                  <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-semibold bg-slate-100 text-slate-800 border border-slate-200 tabular-nums">
                    Totalt: ${appData.participants.length}
                  </span>
                  <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-semibold bg-emerald-50 text-emerald-800 border border-emerald-200 tabular-nums">
                    På plats: ${studioCount}
                  </span>
                  <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-semibold bg-blue-50 text-blue-800 border border-blue-200 tabular-nums">
                    På distans: ${remoteCount}
                  </span>
                </div>
              </div>

              <!-- Formulär för att lägga till / redigera deltagare -->
              <form id="participant-form" class="mb-6 pb-6 border-b border-slate-200">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
                  <div>
                    <label for="part-name" class="block text-sm font-semibold text-slate-800 mb-1.5">
                      Namn
                    </label>
                    <input
                      id="part-name"
                      type="text"
                      class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 bg-white text-slate-900 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-600"
                      value="${escapeHtml(f.name)}"
                      placeholder="Förnamn Efternamn"
                    />
                  </div>

                  <div>
                    <label for="part-org" class="block text-sm font-semibold text-slate-800 mb-1.5">
                      Organisation
                    </label>
                    <input
                      id="part-org"
                      type="text"
                      class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 bg-white text-slate-900 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-600"
                      value="${escapeHtml(f.organization)}"
                      placeholder="Kommun, region eller myndighet"
                    />
                  </div>

                  <div>
                    <label for="part-role" class="block text-sm font-semibold text-slate-800 mb-1.5">
                      Titel / roll (valfritt)
                    </label>
                    <input
                      id="part-role"
                      type="text"
                      class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 bg-white text-slate-900 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-600"
                      value="${escapeHtml(f.role)}"
                      placeholder="T.ex. Utredare, Moderator"
                    />
                  </div>
                </div>

                <!-- Segmented toggle: På plats vs På distans -->
                <div class="mb-4">
                  <span class="block text-sm font-semibold text-slate-800 mb-2">
                    Medverkandeform
                  </span>
                  <div class="inline-flex rounded-xl border border-slate-300 bg-slate-100 p-1 gap-1">
                    <button
                      type="button"
                      data-mode-choice="studio"
                      class="px-4 py-2 rounded-lg text-sm font-semibold transition-colors cursor-pointer ${
                        f.mode === 'studio'
                          ? 'bg-indigo-600 text-white shadow-2xs'
                          : 'text-slate-700 hover:text-slate-900'
                      }"
                    >
                      På plats
                    </button>
                    <button
                      type="button"
                      data-mode-choice="remote"
                      class="px-4 py-2 rounded-lg text-sm font-semibold transition-colors cursor-pointer ${
                        f.mode === 'remote'
                          ? 'bg-indigo-600 text-white shadow-2xs'
                          : 'text-slate-700 hover:text-slate-900'
                      }"
                    >
                      På distans
                    </button>
                  </div>
                </div>

                <!-- Distansfält (utan teknikgenomgång) -->
                ${
                  f.mode === 'remote'
                    ? `<div class="grid grid-cols-1 md:grid-cols-2 gap-4 p-4 mb-4 rounded-xl bg-blue-50/70 border border-blue-200">
                        <div>
                          <label for="part-email" class="block text-sm font-semibold text-slate-800 mb-1.5">
                            Mailadress
                          </label>
                          <input
                            id="part-email"
                            type="email"
                            class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 bg-white text-slate-900 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-600"
                            value="${escapeHtml(f.email)}"
                            placeholder="namn@organisation.se"
                          />
                        </div>

                        <div>
                          <label for="part-mobile" class="block text-sm font-semibold text-slate-800 mb-1.5">
                            Mobilnummer
                          </label>
                          <input
                            id="part-mobile"
                            type="tel"
                            class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 bg-white text-slate-900 text-sm tabular-nums focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-600"
                            value="${escapeHtml(f.mobile)}"
                            placeholder="070-123 45 67"
                          />
                        </div>
                      </div>`
                    : ''
                }

                ${
                  f.error
                    ? `<p class="text-sm font-semibold text-rose-600 mb-3">${escapeHtml(f.error)}</p>`
                    : ''
                }

                <div class="flex flex-wrap items-center gap-2.5">
                  <button
                    type="submit"
                    class="px-4 py-2.5 rounded-xl bg-indigo-600 text-white text-sm font-semibold hover:bg-indigo-700 transition-colors shadow-xs cursor-pointer"
                  >
                    ${uiState.editingParticipantId ? 'Spara ändringar' : '+ Lägg till deltagare'}
                  </button>
                  ${
                    uiState.editingParticipantId
                      ? `<button
                          id="btn-cancel-edit-part"
                          type="button"
                          class="px-4 py-2.5 rounded-xl border border-slate-300 bg-white text-slate-700 text-sm font-semibold hover:bg-slate-50 transition-colors cursor-pointer"
                        >
                          Avbryt redigering
                        </button>`
                      : ''
                  }
                </div>
              </form>

              <div>
                <h3 class="text-base font-bold text-slate-900 mb-3">
                  Registrerade medverkande (${appData.participants.length})
                </h3>
                ${listHtml}
              </div>
            </div>
          </section>
        `;

        // Synka inputvärden till uiState.partForm
        const inputMap = [
          ['part-name', 'name'],
          ['part-org', 'organization'],
          ['part-role', 'role'],
          ['part-email', 'email'],
          ['part-mobile', 'mobile'],
        ];
        inputMap.forEach(function (pair) {
          const el = document.getElementById(pair[0]);
          if (el) {
            el.addEventListener('input', function () {
              uiState.partForm[pair[1]] = el.value;
            });
          }
        });

        stepContainerEl.querySelectorAll('button[data-mode-choice]').forEach(function (btn) {
          btn.addEventListener('click', function () {
            uiState.partForm.mode = btn.getAttribute('data-mode-choice');
            uiState.partForm.error = '';
            renderStep2();
          });
        });

        const cancelBtn = document.getElementById('btn-cancel-edit-part');
        if (cancelBtn) {
          cancelBtn.addEventListener('click', function () {
            resetParticipantForm();
            renderStep2();
          });
        }

        document.getElementById('participant-form').addEventListener('submit', function (e) {
          e.preventDefault();
          const trimmedName = uiState.partForm.name.trim();
          if (!trimmedName) {
            uiState.partForm.error = 'Ange deltagarens namn.';
            renderStep2();
            return;
          }

          const isRemote = uiState.partForm.mode === 'remote';
          const trimmedEmail = uiState.partForm.email.trim();
          const trimmedMobile = uiState.partForm.mobile.trim();

          if (isRemote && !trimmedEmail && !trimmedMobile) {
            uiState.partForm.error = 'Ange mailadress eller mobilnummer för deltagare på distans.';
            renderStep2();
            return;
          }

          if (uiState.editingParticipantId) {
            appData.participants = appData.participants.map(function (p) {
              if (p.id !== uiState.editingParticipantId) return p;
              return {
                id: p.id,
                name: trimmedName,
                organization: uiState.partForm.organization.trim(),
                role: uiState.partForm.role.trim(),
                mode: uiState.partForm.mode,
                email: isRemote ? trimmedEmail : '',
                mobile: isRemote ? trimmedMobile : '',
              };
            });
            resetParticipantForm();
            persistData();
            renderStepper();
            renderStep2();
            showToast(`Uppdaterade ${trimmedName}.`);
          } else {
            const newPerson = {
              id: `p-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
              name: trimmedName,
              organization: uiState.partForm.organization.trim(),
              role: uiState.partForm.role.trim(),
              mode: uiState.partForm.mode,
              email: isRemote ? trimmedEmail : '',
              mobile: isRemote ? trimmedMobile : '',
            };
            appData.participants.push(newPerson);
            resetParticipantForm();
            persistData();
            renderStepper();
            renderStep2();
            showToast(`La till ${trimmedName} i deltagarlistan.`);
          }
        });

        stepContainerEl.querySelectorAll('button[data-edit-person]').forEach(function (btn) {
          btn.addEventListener('click', function () {
            const id = btn.getAttribute('data-edit-person');
            const person = appData.participants.find(function (p) { return p.id === id; });
            if (!person) return;
            uiState.editingParticipantId = person.id;
            uiState.partForm = {
              name: person.name,
              organization: person.organization || '',
              role: person.role || '',
              mode: person.mode === 'remote' ? 'remote' : 'studio',
              email: person.email || '',
              mobile: person.mobile || '',
              error: '',
            };
            renderStep2();
          });
        });

        stepContainerEl.querySelectorAll('button[data-delete-person]').forEach(function (btn) {
          btn.addEventListener('click', function () {
            const id = btn.getAttribute('data-delete-person');
            const target = appData.participants.find(function (p) { return p.id === id; });
            appData.participants = appData.participants.filter(function (p) { return p.id !== id; });
            appData.events = appData.events.map(function (ev) {
              return Object.assign({}, ev, {
                speakerIds: (ev.speakerIds || []).filter(function (sid) { return sid !== id; }),
              });
            });
            if (uiState.editingParticipantId === id) {
              resetParticipantForm();
            }
            persistData();
            renderStepper();
            renderStep2();
            if (target) {
              showToast(`Tog bort ${target.name} från deltagarlistan.`);
            }
          });
        });
      }

      // -----------------------------------------------------------------------
      // 8. STEG 3: KÖRSCHEMA
      // -----------------------------------------------------------------------
      function handleQuickAddEvent(kind) {
        const defaultSpeakers =
          appData.participants.length > 0 ? [appData.participants[0].id] : [];
        const firstName =
          appData.participants.length > 0
            ? appData.participants[0].name.split(' ')[0]
            : 'Deltagare';

        let created;
        if (kind === 'program') {
          created = {
            id: `ev-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
            type: 'program',
            title: 'Ny programpunkt',
            durationMinutes: 10,
            speakerIds: defaultSpeakers,
            material: 'Master PPT',
            extraNote: '',
          };
        } else if (kind === 'enter') {
          created = {
            id: `ev-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
            type: 'enter_exit',
            action: 'enter',
            title: `${firstName} på`,
            durationMinutes: 0,
            speakerIds: defaultSpeakers,
            material: '',
            extraNote: '',
          };
        } else {
          created = {
            id: `ev-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
            type: 'enter_exit',
            action: 'exit',
            title: `${firstName} av`,
            durationMinutes: 0,
            speakerIds: defaultSpeakers,
            material: '',
            extraNote: '',
          };
        }

        appData.events.push(created);
        uiState.expandedEventId = created.id;
        persistData();
        renderStepper();
        renderStep3();
      }

      function renderStep3() {
        const plannedDuration = computePlannedBroadcastDuration(
          appData.brief.date,
          appData.brief.startTime,
          appData.brief.endTime
        );
        const analysis = analyzeScheduleAndMics(
          appData.brief,
          appData.participants,
          appData.events
        );

                        ${

        stepContainerEl.innerHTML = `
          <section aria-labelledby="step3-heading">

                </h2>
                <p class="text-sm text-slate-600 mt-1">
                  Pussla ihop sändningens programpunkter samt när deltagare går på och går av. Dra korten i handtaget eller använd pilarna för att ändra ordning.
                </p>
              </div>

              <!-- Tidsöversikt -->
              <div class="grid grid-cols-1 md:grid-cols-3 gap-3 mb-5 tabular-nums">
                <div class="p-3.5 rounded-xl bg-slate-50 border border-slate-200">
                  <div class="text-xs font-semibold text-slate-500">Starttid</div>
                  <div class="text-lg font-bold text-slate-900 mt-0.5">
                    ${escapeHtml(appData.brief.startTime || '13:00')}
                  </div>
                  <div class="text-xs text-slate-600 mt-0.5">
                    Planerat slut: ${escapeHtml(appData.brief.endTime || '14:00')}
                  </div>
                </div>

                <div class="p-3.5 rounded-xl bg-slate-50 border border-slate-200">
                  <div class="text-xs font-semibold text-slate-500">Beräknad sluttid</div>
                  <div class="text-lg font-bold text-slate-900 mt-0.5">
                    ${analysis.scheduledEndFormatted}
                  </div>
                  <div class="text-xs font-semibold mt-0.5 ${comparisonClass}">
                    ${escapeHtml(comparisonText)}
                  </div>
                </div>

                <div class="p-3.5 rounded-xl bg-slate-50 border border-slate-200">
                  <div class="text-xs font-semibold text-slate-500">Schemalagd programtid</div>
                  <div class="text-lg font-bold text-slate-900 mt-0.5">
                    ${analysis.totalProgramMinutes} min
                  </div>
                  <div class="text-xs text-slate-600 mt-0.5">
                    Antal händelser: ${analysis.computedEvents.length} st
                  </div>
                </div>
              </div>

              <!-- Snabbknappar för att lägga till händelser -->
              <div class="flex flex-wrap items-center gap-2.5 p-3.5 mb-5 rounded-xl bg-slate-50 border border-slate-200">
                <span class="text-sm font-semibold text-slate-700 mr-1">
                  Lägg till händelse:
                </span>
                <button
                  id="btn-add-program"
                  type="button"
                  class="px-3.5 py-2 rounded-xl bg-amber-500 text-white text-xs sm:text-sm font-semibold hover:bg-amber-600 transition-colors cursor-pointer"
                >
                  + Programpunkt
                </button>
                <button
                  id="btn-add-enter"
                  type="button"
                  class="px-3.5 py-2 rounded-xl bg-emerald-600 text-white text-xs sm:text-sm font-semibold hover:bg-emerald-700 transition-colors cursor-pointer"
                >
                  + Person går på
                </button>
                <button
                  id="btn-add-exit"
                  type="button"
                  class="px-3.5 py-2 rounded-xl bg-rose-600 text-white text-xs sm:text-sm font-semibold hover:bg-rose-700 transition-colors cursor-pointer"
                >
                  + Person går av
                </button>
              </div>

              ${timelineHtml}
            </div>
          </section>
        `;

        document.getElementById('btn-add-program').addEventListener('click', function () {
          handleQuickAddEvent('program');
        });
        document.getElementById('btn-add-enter').addEventListener('click', function () {
          handleQuickAddEvent('enter');
        });
        document.getElementById('btn-add-exit').addEventListener('click', function () {
          handleQuickAddEvent('exit');
        });

        // Expand / kollapsa inline-redigering
        stepContainerEl.querySelectorAll('button[data-toggle-expand]').forEach(function (btn) {
          btn.addEventListener('click', function () {
            const id = btn.getAttribute('data-toggle-expand');
            uiState.expandedEventId = uiState.expandedEventId === id ? null : id;
            renderStep3();
          });
        });

        // Flytta upp / ner
        stepContainerEl.querySelectorAll('button[data-move-up]').forEach(function (btn) {
          btn.addEventListener('click', function () {
            const idx = Number(btn.getAttribute('data-move-up'));
            if (idx <= 0) return;
            const moved = appData.events.splice(idx, 1)[0];
            appData.events.splice(idx - 1, 0, moved);
            persistData();
            renderStep3();
          });
        });

        stepContainerEl.querySelectorAll('button[data-move-down]').forEach(function (btn) {
          btn.addEventListener('click', function () {
            const idx = Number(btn.getAttribute('data-move-down'));
            if (idx >= appData.events.length - 1) return;
            const moved = appData.events.splice(idx, 1)[0];
            appData.events.splice(idx + 1, 0, moved);
            persistData();
            renderStep3();
          });
        });

        // Ta bort händelse
        stepContainerEl.querySelectorAll('button[data-delete-event]').forEach(function (btn) {
          btn.addEventListener('click', function () {
            const id = btn.getAttribute('data-delete-event');
            appData.events = appData.events.filter(function (ev) { return ev.id !== id; });
            if (uiState.expandedEventId === id) {
              uiState.expandedEventId = null;
            }
            persistData();
            renderStepper();
            renderStep3();
          });
        });

        // Inline input-fält (uppdaterar data utan att störa skrivfokus)
        stepContainerEl.querySelectorAll('input[data-ev-field]').forEach(function (inp) {
          inp.addEventListener('input', function () {
            const id = inp.getAttribute('data-ev-id');
            const field = inp.getAttribute('data-ev-field');
            appData.events = appData.events.map(function (ev) {
              if (ev.id !== id) return ev;
              const patch = {};
              patch[field] =
                field === 'durationMinutes'
                  ? Math.max(0, Number(inp.value) || 0)
                  : inp.value;
              return Object.assign({}, ev, patch);
            });
            persistData();
          });
        });

        // Snabbval av presentationsmaterial
        stepContainerEl.querySelectorAll('button[data-preset-ev]').forEach(function (btn) {
          btn.addEventListener('click', function () {
            const id = btn.getAttribute('data-preset-ev');
            const val = btn.getAttribute('data-preset-val');
            appData.events = appData.events.map(function (ev) {
              return ev.id === id ? Object.assign({}, ev, { material: val }) : ev;
            });
            persistData();
            renderStep3();
          });
        });

        // Byt mellan Person går på / Person går av
        stepContainerEl.querySelectorAll('select[data-ev-action]').forEach(function (sel) {
          sel.addEventListener('change', function () {
            const id = sel.getAttribute('data-ev-action');
            const nextAct = sel.value;
            appData.events = appData.events.map(function (ev) {
              if (ev.id !== id) return ev;
              const names = (ev.speakerIds || [])
                .map(function (sid) {
                  return appData.participants.find(function (p) { return p.id === sid; });
                })
                .filter(Boolean)
                .map(function (p) { return p.name.split(' ')[0]; });
              const prefix = names.length > 0 ? names.join(' + ') : 'Deltagare';
              const suggested = nextAct === 'enter' ? `${prefix} på` : `${prefix} av`;
              return Object.assign({}, ev, { action: nextAct, title: suggested });
            });
            persistData();
            renderStep3();
          });
        });

        // Klickbara deltagarchips
        stepContainerEl.querySelectorAll('button[data-toggle-speaker]').forEach(function (btn) {
          btn.addEventListener('click', function () {
            const evId = btn.getAttribute('data-toggle-speaker');
            const speakerId = btn.getAttribute('data-speaker-id');
            appData.events = appData.events.map(function (ev) {
              if (ev.id !== evId) return ev;
              const current = ev.speakerIds || [];
              const nextSpeakers = current.includes(speakerId)
                ? current.filter(function (id) { return id !== speakerId; })
                : current.concat([speakerId]);

              let nextTitle = ev.title;
              if (ev.type === 'enter_exit') {
                const names = nextSpeakers
                  .map(function (id) {
                    return appData.participants.find(function (p) { return p.id === id; });
                  })
                  .filter(Boolean)
                  .map(function (p) { return p.name.split(' ')[0]; });
                const label = names.length > 0 ? names.join(' + ') : 'Deltagare';
                nextTitle = ev.action === 'enter' ? `${label} på` : `${label} av`;
              }

              return Object.assign({}, ev, { speakerIds: nextSpeakers, title: nextTitle });

            persistData();
            renderStep3();
          });

        // Drag-and-drop omsortering
        const cards = stepContainerEl.querySelectorAll('div[data-event-card]');
        cards.forEach(function (card) {

          const handle = card.querySelector('[data-drag-handle]');

          if (handle) {
            handle.addEventListener('mousedown', function () {
              card.setAttribute('draggable', 'true');
            });
            handle.addEventListener('mouseup', function () {
              if (uiState.expandedEventId === card.getAttribute('data-event-card')) {
                card.setAttribute('draggable', 'false');
              }
            });
          }

          card.addEventListener('dragstart', function (e) {
            uiState.draggedIndex = idx;
            card.classList.add('opacity-50');
            if (e.dataTransfer) {
              e.dataTransfer.effectAllowed = 'move';
            }
          });

          card.addEventListener('dragover', function (e) {
            e.preventDefault();
            if (uiState.draggedIndex !== null && uiState.draggedIndex !== idx) {
              card.classList.add('ring-2', 'ring-indigo-500');
            }

          card.addEventListener('dragleave', function () {
            card.classList.remove('ring-2', 'ring-indigo-500');
          });

          card.addEventListener('drop', function (e) {
            e.preventDefault();
            card.classList.remove('ring-2', 'ring-indigo-500');
            const fromIdx = uiState.draggedIndex;
            uiState.draggedIndex = null;
            if (fromIdx === null || fromIdx === idx) return;
            const moved = appData.events.splice(fromIdx, 1)[0];
            appData.events.splice(idx, 0, moved);
            persistData();
            renderStep3();
          });

          card.addEventListener('dragend', function () {
            uiState.draggedIndex = null;
            card.classList.remove('opacity-50', 'ring-2', 'ring-indigo-500');
          });
        });

      // -----------------------------------------------------------------------
      // 9. STEG 4: GRANSKA & EXPORTERA
      // -----------------------------------------------------------------------
      function renderStep4() {
        const b = appData.brief;
        const plannedDuration = computePlannedBroadcastDuration(b.date, b.startTime, b.endTime);
        const swedishDateTimeText = formatSwedishDateDisplay(b.date, b.startTime, b.endTime);
        const analysis = analyzeScheduleAndMics(b, appData.participants, appData.events);

        const remoteCount = appData.participants.filter(function (p) {
          return p.mode === 'remote';
        }).length;
        const studioCount = appData.participants.length - remoteCount;
        const previewParticipantRows = Math.max(8, analysis.orderedParticipants.length);

        const scheduleRowsHtml =
          analysis.computedEvents.length === 0
            ? `<tr>
                <td colspan="8" style="padding: 14px;">
                  Inga händelser inlagda i körschemat.
                </td>
              </tr>`
            : analysis.computedEvents
                .map(function (ev) {
                  const isProgram = ev.type === 'program';
                  const rowClass = isProgram
                    ? 'excel-prog'
                    : ev.action === 'enter'
                      ? 'excel-enter'
                      : 'excel-exit';
                  const namesStr = ev.speakers
                    .map(function (s) { return s.name; })
                    .join(', ');

                  return `
                    <tr>
                      <td class="${rowClass}">${isProgram ? escapeHtml(ev.startFormatted) : ''}</td>
                      <td class="${rowClass}">${isProgram ? escapeHtml(ev.endFormatted) : ''}</td>
                      <td class="${rowClass}">${isProgram ? ev.durationMin : ''}</td>
                      <td class="${rowClass}" style="font-weight: 700;">${escapeHtml(ev.title)}</td>
                      <td class="${rowClass}">${escapeHtml(namesStr)}</td>
                      <td class="${rowClass}">${isProgram ? escapeHtml(ev.material || '') : ''}</td>
                      <td class="${isProgram ? 'excel-mic-cell' : rowClass}">${escapeHtml(ev.autoMicText)}</td>
                      <td class="${isProgram ? '' : rowClass}">${escapeHtml(ev.extraNote || '')}</td>
                    </tr>
                  `;
                })
                .join('');

        const bufferRowsHtml = [1, 2, 3]
          .map(function () {
            return `
              <tr>

      function exportFallbackCsv() {
        const b = appData.brief;
        const plannedDuration = computePlannedBroadcastDuration(b.date, b.startTime, b.endTime);
        const swedishDateTimeText = formatSwedishDateDisplay(b.date, b.startTime, b.endTime);
        const analysis = analyzeScheduleAndMics(b, appData.participants, appData.events);

        const rows = [
          [b.templateTitle || 'Quickchannel körschema på 4F'],
          ['Namn på sändning (som publicerad)', b.title || ''],
          ['Datum och sändningstid', `${swedishDateTimeText} (${plannedDuration.humanText})`],
          ['Ansvarig handläggare', b.handler || ''],
          ['Telefonnummer', b.phone || ''],
          ['Mailadress', b.email || ''],
          ['Chattfunktion (Ja/Nej)', b.chatEnabled],
          ['Ska inspelning vara tillgänglig? Hur länge?', b.recordingAvailable],
          [],
          [
            'Start',
            'Slut',
            'Min',
            'Programpunkt',
            'Vem/vilka talar under programpunkten',
            'Presentationsmaterial för programpunkt (t.ex PPT eller Menti mm.)',
            'Extra notering',
            'Tekniska kommentarer och tid för anslutning',
          ],
        ];

        analysis.computedEvents.forEach(function (ev) {
          rows.push([
            ev.type === 'program' ? ev.startFormatted : '',
            ev.type === 'program' ? ev.endFormatted : '',
            ev.type === 'program' ? String(ev.durationMin) : '',
            ev.title || '',
            ev.speakers.map(function (s) { return s.name; }).join(', '),
            ev.type === 'program' ? ev.material || '' : '',
            ev.autoMicText || '',
            ev.extraNote || '',
          ]);
        });

        const csvContent =
          '\uFEFF' +
          rows
            .map(function (r) {
              return r
                .map(function (cell) {
                  return `"${String(cell == null ? '' : cell).replace(/"/g, '""')}"`;
                })
                .join(';');
            })
            .join('\r\n');

        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const cleanTitle = (b.title || 'Korschema')
          .trim()
          .replace(/[\\/:*?"<>|]+/g, '')
          .replace(/\s+/g, '_');
        const a = document.createElement('a');
        a.href = url;
        a.download = `${cleanTitle}_${b.date || 'schema'}.csv`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showToast('Exporterade CSV-reservfil för Excel.');
      }

      async function handleExportExcel() {
        uiState.exportingXlsx = true;
        renderBottomNav();
        if (uiState.activeStep === 4) {
          const topBtn = document.getElementById('btn-export-xlsx-top');
          if (topBtn) {
            topBtn.disabled = true;
            topBtn.textContent = 'Genererar .xlsx...';
          }
        }

        try {
          const ExcelJS = await ensureExcelJS();
          const b = appData.brief;
          const plannedDuration = computePlannedBroadcastDuration(b.date, b.startTime, b.endTime);
          const swedishDateTimeText = formatSwedishDateDisplay(b.date, b.startTime, b.endTime);
          const analysis = analyzeScheduleAndMics(b, appData.participants, appData.events);

          const workbook = new ExcelJS.Workbook();
          workbook.creator = 'Körschema Studio';
          workbook.created = new Date();

          const thinBorder = {
            top: { style: 'thin', color: { argb: 'FF808080' } },
            left: { style: 'thin', color: { argb: 'FF808080' } },
            bottom: { style: 'thin', color: { argb: 'FF808080' } },
            right: { style: 'thin', color: { argb: 'FF808080' } },
          };

          const headerFill = {
            type: 'pattern',
            pattern: 'solid',
            fgColor: { argb: 'FF595959' }, // Mörkgrå (#595959)
          };

          const progFill = {
            type: 'pattern',
            pattern: 'solid',
            fgColor: { argb: 'FFFAC090' }, // Ljusorange (#FAC090)
          };

          const enterFill = {
            type: 'pattern',
            pattern: 'solid',
            fgColor: { argb: 'FFD8E4BC' }, // Ljusgrön (#D8E4BC)
          };

          const exitFill = {
            type: 'pattern',
            pattern: 'solid',
            fgColor: { argb: 'FFE6B8B7' }, // Ljusröd (#E6B8B7)
          };

          const whiteFill = {
            type: 'pattern',
            pattern: 'solid',
            fgColor: { argb: 'FFFFFFFF' },
          };

          const headerFont = { name: 'Calibri', size: 11, bold: true, color: { argb: 'FFFFFFFF' } };
          const bodyFont = { name: 'Calibri', size: 11, bold: false, color: { argb: 'FF000000' } };
          const boldFont = { name: 'Calibri', size: 11, bold: true, color: { argb: 'FF000000' } };

          // -----------------------------------------------------------------
          // FLIK 1: KÖRSCHEMA
          // -----------------------------------------------------------------
          const ws1 = workbook.addWorksheet('Körschema');
          ws1.columns = [
            { width: 9 },
            { width: 9 },
            { width: 9 },
            { width: 40 },
            { width: 34 },
            { width: 38 },
            { width: 28 },
            { width: 38 },
          ];

          // Rad 1-3: Mörkgrå banner (#595959)
          ws1.getRow(1).height = 10;
          ws1.getRow(2).height = 32;
          ws1.getRow(3).height = 10;

          for (let r = 1; r <= 3; r++) {
            for (let c = 1; c <= 8; c++) {
              ws1.getCell(r, c).fill = headerFill;
            }
          }

          const bannerCell = ws1.getCell('D2');
          bannerCell.value = b.templateTitle || 'Quickchannel körschema på 4F';
          bannerCell.font = { name: 'Calibri', size: 18, bold: true, color: { argb: 'FFFFFFFF' } };
          bannerCell.alignment = { vertical: 'middle', horizontal: 'left' };

          // Rad 4-5: Namn på sändning och Datum & sändningstid
          ws1.getRow(4).height = 24;
          ws1.mergeCells('A4:D4');
          ws1.mergeCells('E4:H4');
          ws1.getCell('A4').value = 'Namn på sändning (som publicerad)';
          ws1.getCell('E4').value = 'Datum och sändningstid';
          for (let c = 1; c <= 8; c++) {
            const cell = ws1.getCell(4, c);
            cell.fill = headerFill;
            cell.font = headerFont;
            cell.border = thinBorder;
            cell.alignment = { vertical: 'middle', horizontal: 'left' };
          }

          ws1.getRow(5).height = 24;
          ws1.mergeCells('A5:D5');
          ws1.mergeCells('E5:H5');
          ws1.getCell('A5').value = b.title || '';
          ws1.getCell('E5').value = `${swedishDateTimeText} (${plannedDuration.humanText})`;
          for (let c = 1; c <= 8; c++) {
            const cell = ws1.getCell(5, c);
            cell.fill = whiteFill;
            cell.font = c <= 4 ? boldFont : bodyFont;
            cell.border = thinBorder;
            cell.alignment = { vertical: 'middle', horizontal: 'left', wrapText: true };
          }

          // Rad 6-7: Telefon, Ansvarig handläggare, Mailadress, Chatt, Inspelning
          ws1.getRow(6).height = 28;
          ws1.mergeCells('A6:B6');
          ws1.mergeCells('C6:D6');
          ws1.mergeCells('G6:H6');
          ws1.getCell('A6').value = 'Telefonnummer';
          ws1.getCell('C6').value = 'Ansvarig handläggare';
          ws1.getCell('E6').value = 'Mailadress';
          ws1.getCell('F6').value = 'Chattfunktion (Ja/Nej)';
          ws1.getCell('G6').value = 'Ska inspelning vara tillgänglig? Hur länge?';
          for (let c = 1; c <= 8; c++) {
            const cell = ws1.getCell(6, c);
            cell.fill = headerFill;
            cell.font = headerFont;
            cell.border = thinBorder;
            cell.alignment = { vertical: 'middle', horizontal: 'left', wrapText: true };
          }

          ws1.getRow(7).height = 24;
          ws1.mergeCells('A7:B7');
          ws1.mergeCells('C7:D7');
          ws1.mergeCells('G7:H7');
          ws1.getCell('A7').value = b.phone || '';
          ws1.getCell('C7').value = b.handler || '';
          ws1.getCell('E7').value = b.email || '';
          ws1.getCell('F7').value = b.chatEnabled || 'Ja';
          ws1.getCell('G7').value = b.recordingAvailable || 'Ja, 30 dagar';

          ws1.getCell('F7').dataValidation = {
            type: 'list',
            allowBlank: true,
            formulae: ['"Ja,Nej"'],
          };
          ws1.getCell('G7').dataValidation = {
            type: 'list',
            allowBlank: true,
            formulae: ['"Ja, 14 dagar,Ja, 30 dagar,Ja, mer än 30 dagar,Nej"'],
          };

          for (let c = 1; c <= 8; c++) {
            const cell = ws1.getCell(7, c);
            cell.fill = whiteFill;
            cell.font = bodyFont;
            cell.border = thinBorder;
            cell.alignment = { vertical: 'middle', horizontal: 'left', wrapText: true };
          }

          // Rad 8: Tabellhuvud för körschemat
          ws1.getRow(8).height = 36;
          const headers = [
            'Start',
            'Slut',
            'Min',
            'Programpunkt',
            'Vem/vilka talar under programpunkten',
            'Presentationsmaterial för programpunkt (t.ex PPT eller Menti mm.)',
            'Extra notering',
            'Tekniska kommentarer och tid för anslutning',
          ];
          headers.forEach(function (hText, idx) {
            const cell = ws1.getCell(8, idx + 1);
            cell.value = hText;
            cell.fill = headerFill;
            cell.font = headerFont;
            cell.border = thinBorder;
            cell.alignment = { vertical: 'middle', horizontal: 'left', wrapText: true };
          });

          // Schemarader från rad 9
          let rowCursor = 9;
          analysis.computedEvents.forEach(function (ev) {
            const row = ws1.getRow(rowCursor);
            row.height = 26;
            const namesText = ev.speakers.map(function (s) { return s.name; }).join(', ');

            if (ev.type === 'program') {
              const sFrac = ((((ev.startMin || 0) % 1440) + 1440) % 1440) / 1440;
              const eFrac = ((((ev.endMin || 0) % 1440) + 1440) % 1440) / 1440;
              const dFrac = ev.durationMin / 1440;

              const c1 = ws1.getCell(rowCursor, 1);
              c1.value = sFrac;
              c1.numFmt = 'hh:mm';

              const c2 = ws1.getCell(rowCursor, 2);
              c2.value = eFrac;
              c2.numFmt = 'hh:mm';

              const c3 = ws1.getCell(rowCursor, 3);
              c3.value = { formula: `B${rowCursor}-A${rowCursor}`, result: dFrac };
              c3.numFmt = '[hh]:mm';

              ws1.getCell(rowCursor, 4).value = ev.title || '';
              ws1.getCell(rowCursor, 5).value = namesText;
              ws1.getCell(rowCursor, 6).value = ev.material || '';
              ws1.getCell(rowCursor, 7).value = ev.autoMicText || '';
              ws1.getCell(rowCursor, 8).value = ev.extraNote || '';

              for (let c = 1; c <= 8; c++) {
                const cell = ws1.getCell(rowCursor, c);
                cell.border = thinBorder;
                cell.font = c === 4 || c === 7 ? boldFont : bodyFont;
                cell.alignment = { vertical: 'middle', horizontal: 'left', wrapText: true };
                if (c === 7) {
                  cell.fill = enterFill; // Ljusgrön fyllning #D8E4BC i kolumn G för MIK
                } else if (c === 8) {
                  cell.fill = whiteFill;
                } else {
                  cell.fill = progFill; // Ljusorange fyllning #FAC090
                }
              }
            } else {
              const rowFill = ev.action === 'enter' ? enterFill : exitFill;
              ws1.getCell(rowCursor, 4).value = ev.title || '';
              ws1.getCell(rowCursor, 5).value = namesText;
              ws1.getCell(rowCursor, 7).value = ev.autoMicText || '';
              ws1.getCell(rowCursor, 8).value = ev.extraNote || '';

              for (let c = 1; c <= 8; c++) {
                const cell = ws1.getCell(rowCursor, c);
                cell.border = thinBorder;
                cell.font = c === 4 || c === 7 ? boldFont : bodyFont;
                cell.fill = rowFill;
                cell.alignment = { vertical: 'middle', horizontal: 'left', wrapText: true };
              }
            }

            rowCursor += 1;
          });

          // 3 tomma buffert-rader under schemat med formeln =B{r}-A{r}
          for (let bIdx = 1; bIdx <= 3; bIdx++) {
            const bRow = ws1.getRow(rowCursor);
            bRow.height = 22;
            const c3 = ws1.getCell(rowCursor, 3);
            c3.value = { formula: `B${rowCursor}-A${rowCursor}`, result: 0 };
            c3.numFmt = '[hh]:mm';

            for (let c = 1; c <= 8; c++) {
              const cell = ws1.getCell(rowCursor, c);
              cell.fill = whiteFill;
              cell.font = bodyFont;
              cell.border = thinBorder;
              cell.alignment = { vertical: 'middle', horizontal: 'left' };
            }
            rowCursor += 1;
